# CLIProxyAPI Configuration
# =========================
# OAuth proxy sidecar for Claude API access.
# All agent Claude traffic MUST route through this proxy for audit logging.
# Direct access to api.anthropic.com is blocked by egress rules.

[server]
listen_address = 127.0.0.1
listen_port = 8317
health_endpoint = /health
health_port = 8317

[auth]
# API key sourced from environment variable (injected via ESO from Vault)
api_key_env = ANTHROPIC_API_KEY
upstream_url = https://api.anthropic.com

[models]
# Allowed model aliases and their canonical IDs
opus = claude-opus-4-6
sonnet = claude-sonnet-4-6
haiku = claude-haiku-4-5-20251001

# Default model when none specified
default = sonnet

[rate_limits]
# Per-agent rate limits (identified by X-Agent-ID header)
requests_per_minute = 100
burst_size = 20
# Global ceiling across all agents
global_requests_per_minute = 500

[rate_limits.support]
# CS agent — external-facing, highest-risk. Tighter limits than internal agents.
requests_per_minute = 30
requests_per_hour = 300
burst_size = 5
max_input_tokens = 8000
max_output_tokens = 2000
max_conversation_turns = 20
max_concurrent_sessions = 50

[logging]
# JSON structured logging to stdout — picked up by K8s log collector (Promtail/Loki)
format = json
output = stdout
level = info
# Fields included in every log line
include_fields = timestamp,agent_id,model,tokens_in,tokens_out,latency_ms,status_code

[timeouts]
# Proxy timeouts in seconds
connect_timeout = 10
read_timeout = 300
write_timeout = 30

[tls]
# Upstream TLS verification (api.anthropic.com)
verify_upstream = true
# No TLS on listen side — localhost only, inside the pod
listen_tls = false
