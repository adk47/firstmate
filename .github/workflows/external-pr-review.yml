name: external-pr-review

# QA auto-review of PRs in OTHER Muso-AI repos (currently Muso-AI/ads-manager),
# reusing hydra's qa agent + muso-github-code-review skill.
#
# Transport: the source repo (ads-manager) fires a repository_dispatch into hydra
# (event_type "ads-manager-qa-review") carrying the PR coordinates in
# client_payload. This box is the only place the openclaw CLI + gateway live, so
# the dispatch must land here. See ads-manager/.github/workflows/qa-autoreview-trigger.yml
# (the producer) and scripts/qa-dispatch-pr-review.sh (what we call).
#
# Trust model: a repository_dispatch can only be sent by a caller holding a PAT
# with write access to hydra (ads-manager's secrets.DEVOPS_DISPATCH_PAT), so the
# payload is authenticated. We still FORMAT-validate every field below, and the
# downstream skill re-fetches the PR as the gateway's gh account (adk47) — so a
# bogus PR number or unreadable repo fails safe there, and an approval still
# requires real CI-green + a GO verdict on the actual PR. We do NOT re-resolve the
# PR from GitHub here because no hydra-scoped token can read the private
# ads-manager repo; adk47's auth (used by the skill) is the ground truth.

on:
  repository_dispatch:
    types: [ads-manager-qa-review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    # Same on-box runner as qa-autoreview/pr-validate; the openclaw CLI lives here.
    runs-on: [self-hosted, hydra]
    steps:
      - name: Checkout (default branch — main's dispatcher + UID map, not PR code)
        uses: actions/checkout@v5

      - name: Validate payload, map author, and dispatch QA auto-review
        env:
          REPO: ${{ github.event.client_payload.repo }}
          PR: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          AUTHOR: ${{ github.event.client_payload.author }}
          BASE: ${{ github.event.client_payload.base }}
          IS_DRAFT: ${{ github.event.client_payload.is_draft }}
        run: |
          set -euo pipefail

          # --- Repo allowlist: this event_type is ads-manager-only for now. ----
          if [ "$REPO" != "Muso-AI/ads-manager" ]; then
            echo "repo='$REPO' not in the external-review allowlist — refusing."
            exit 1
          fi

          # --- Format validation (defense-in-depth; the dispatcher re-checks). -
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "pr_number='$PR' not numeric — refusing."; exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "head_sha='$HEAD_SHA' not a 7-40 char hex sha — refusing."; exit 1
          fi

          # --- Scope: PRs targeting develop or main, non-draft. ----------------
          if [ "$BASE" != "develop" ] && [ "$BASE" != "main" ]; then
            echo "PR #${PR} base='$BASE' (not develop/main) — skipping."; exit 0
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #${PR} is a draft — skipping."; exit 0
          fi

          # --- Author -> Slack UID. Fail-CLOSED: skip a PR we cannot DM. --------
          if ! REQUESTER_UID="$(bash scripts/lib/qa-author-slack-uid.sh "$AUTHOR")"; then
            echo "PR #${PR} author='$AUTHOR' has no Slack-UID mapping — skipping (add it to scripts/lib/qa-author-slack-uid.sh to enable)."
            exit 0
          fi

          echo "Dispatching QA auto-review of ${REPO}#${PR} @ ${HEAD_SHA} (author=${AUTHOR} -> ${REQUESTER_UID})"
          bash scripts/qa-dispatch-pr-review.sh "$PR" "$HEAD_SHA" "$REPO" "$REQUESTER_UID"
