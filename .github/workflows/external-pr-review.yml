name: external-pr-review

# QA auto-review of PRs in OTHER Muso-AI repos, reusing hydra's qa agent +
# muso-github-code-review skill. The onboarded repos are enumerated in exactly
# ONE place — scripts/lib/qa-external-repo-allowlist.sh; read that file for the
# current list (a copy of it here just goes stale — this comment used to carry
# one, and it had already drifted by the time tests-web-e2e was onboarded).
#
# Transport: a source repo fires a repository_dispatch into hydra carrying the PR
# coordinates in client_payload. New repos use event_type "external-qa-review";
# "ads-manager-qa-review" is the original ads-manager type, kept for back-compat.
# This box is the only place the openclaw CLI + gateway live, so the dispatch must
# land here. See each repo's .github/workflows/qa-autoreview-trigger.yml (the
# producer) and scripts/qa-dispatch-pr-review.sh (what we call).
#
# Trust model: a repository_dispatch is AUTHENTICATED (the sender holds a PAT with
# write access to hydra — each source repo's secrets.DEVOPS_DISPATCH_PAT) but it is
# NOT AUTHORITATIVE. Any holder of any allowlisted repo's dispatch PAT can put
# arbitrary values in client_payload, including `author`. That field decides the
# requester UID, and the requester UID decides the APPROVAL TIER in
# scripts/qa-pr-approve.sh — so trusting the payload author let a caller claim
# `author: nsollazzo` on a PR somebody else wrote and buy that PR an UNSCOPED
# approval. (Guard 4b binds the SCOPED tier to the PR's real author, so only the
# unscoped tier was ever forgeable — which is the tier that matters.)
#
# So the dispatch step below RE-RESOLVES the PR's real author from the GitHub API
# and refuses when it disagrees with the payload, or when it cannot be read at all.
# hydra CAN read those private repos here: not with `github.token` (that is what
# the older version of this comment meant, and it is still true), but with the same
# credentials the ack step uses — the QA_ACK_PAT repo secret when configured, else
# the runner's ambient adk47 gh login on this box. The ack step reads AND writes
# those repos with exactly that chain today.
#
# Everything else stays defense-in-depth: FORMAT-validate every field, allowlist
# the repo, and the downstream skill re-fetches the PR as adk47 — so an approval
# still requires real CI-green + a GO verdict on the actual PR.
#
# Delivery caveat (#214, 2026-07-27): GitHub's repository_dispatch -> Actions-run
# fan-out is BEST-EFFORT. The producer gets HTTP 204 ("event accepted") and then,
# occasionally, no run is ever created — observed 4-6x in the week of 07-20..27
# (e.g. the H-DevOps dispatch of 2026-07-26T16:43:39Z: producer green/204, yet
# hydra's contiguous repository_dispatch run list jumps 16:11:28Z -> 18:27:58Z).
# Not concurrency-cancel (this workflow has no concurrency group; zero cancelled
# runs, all attempts=1), not the runner (offline would leave visible queued runs;
# hydra-node8 shows none), not a types/filter or workflow-file-error window (no
# main pushes near the drops). Hydra cannot retry an event it never received, so
# the "Ack on target PR" first step below makes every DELIVERED dispatch visible
# on the target PR — resender protocol: no ack comment appearing/refreshing
# within ~5 minutes of a dispatch means GitHub dropped it; re-send the identical
# dispatch. run-name below makes drops greppable from `gh run list` too.

# Display-only: name each run after its payload so a missing run for a known
# dispatch (and double-dispatch forensics) is visible straight from
# `gh run list -R Muso-AI/hydra` instead of requiring per-run log digs.
run-name: "qa ${{ github.event.client_payload.repo }}#${{ github.event.client_payload.pr_number }} @ ${{ github.event.client_payload.head_sha }} (${{ github.event.action }})"

on:
  repository_dispatch:
    types: [ads-manager-qa-review, external-qa-review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    # Same on-box runner as qa-autoreview/pr-validate; the openclaw CLI lives here.
    runs-on: [self-hosted, hydra]
    steps:
      # Checked out FIRST (ahead of the ack) so both steps can gate on the same
      # on-disk allowlist — scripts/lib/qa-external-repo-allowlist.sh, from main.
      # The few seconds this costs are irrelevant against the ack's ~5-minute
      # detection window; a checkout failure is itself a loud, visible run.
      - name: Checkout (default branch — main's dispatcher + UID map, not PR code)
        uses: actions/checkout@v5

      # --- Visibility ack (#214) — MUST stay the first step that acts on the
      #     payload. Upserts one marker comment on the target PR with this run's
      #     URL the moment a run actually starts, converting GitHub's silent
      #     repository_dispatch drops (204 to the producer, no run ever created
      #     — see header) into a visible absence: dispatched but no ack within
      #     ~5 min = dropped, re-dispatch. Upsert (not append) so synchronize
      #     re-dispatches refresh one comment instead of spamming busy PRs.
      #     Auth: QA_ACK_PAT repo secret if configured, else the runner's
      #     ambient gh login (the gateway's adk47 account on this same box —
      #     hydra's github.token cannot see the private source repos). Because
      #     this step WRITES with those credentials on an attacker-influenceable
      #     payload, it gates on the SAME repo allowlist as the dispatch step
      #     below, before its first API call.
      #     Best-effort by design: continue-on-error + no `-e`, always exit 0 —
      #     the ack must never block or fail the review itself.
      - name: Ack on target PR (make silent dispatch drops visible)
        continue-on-error: true
        env:
          REPO: ${{ github.event.client_payload.repo }}
          PR: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_ACK_PAT: ${{ secrets.QA_ACK_PAT }}
        run: |
          set -u
          # Never point hydra's credentials at a repo we would refuse to review:
          # same allowlist, same file, checked before any GitHub API call.
          # A refused/malformed payload still fails loud in the validate step
          # below (visible on hydra's side).
          bash scripts/lib/qa-external-repo-allowlist.sh "$REPO" \
            || { echo "ack: repo='$REPO' not in the external-review allowlist — skipping ack"; exit 0; }
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "ack: malformed pr_number — skipping ack"; exit 0; }
          # Don't echo an arbitrary payload string into a PR comment; the
          # validate step will reject the run and the ack links to it.
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || HEAD_SHA="(invalid head_sha — see run log)"
          if [ -n "${QA_ACK_PAT:-}" ]; then export GH_TOKEN="$QA_ACK_PAT"; fi
          marker="<!-- hydra-qa-ack ${REPO}#${PR} -->"
          # Wording is deliberately about DELIVERY, not about a review starting.
          # This step runs before the scope checks below (draft / base branch /
          # author Slack-UID mapping), each of which ends the run with no review
          # at all — a comment promising "QA review started" would be a lie on
          # exactly those PRs. What is true here is only: the dispatch reached
          # hydra and this run exists.
          body="$(printf '%s\n🤖 Dispatch received by hydra for %s @ `%s` — run: %s\n\n_Delivery ack for the external-qa-review dispatch. If a (re-)dispatch does not create/refresh this comment within ~5 minutes, GitHub dropped the repository_dispatch — fire it again._\n\n_(Scope checks run next: a draft PR, a base branch outside develop/main/master, or an author with no Slack-UID mapping is skipped from here — see the run log.)_' \
            "$marker" "${REPO}#${PR}" "$HEAD_SHA" "$RUN_URL")"
          # --paginate is load-bearing: the marker stays where it was FIRST
          # posted, so on a busy PR (>100 comments — core-backend, H-DevOps)
          # it is not on page 1. An unpaginated lookup finds nothing and
          # silently degrades the upsert into one new ack per re-dispatch,
          # spamming exactly the PRs this feature exists for. `head -1` keeps
          # us on the OLDEST marker so the target is stable across runs (and
          # any duplicates already posted before this fix converge on one).
          cid="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments?per_page=100" 2>/dev/null \
            | jq -r --arg m "$marker" '.[] | select(.body | startswith($m)) | .id' 2>/dev/null \
            | head -1 || true)"
          if [ -n "$cid" ]; then
            if gh api -X PATCH "repos/${REPO}/issues/comments/${cid}" -f body="$body" >/dev/null 2>&1; then
              echo "ack: refreshed ack comment ${cid} on ${REPO}#${PR}"; exit 0
            fi
            echo "ack: PATCH of comment ${cid} failed — falling through to POST"
          fi
          if gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null 2>&1; then
            echo "ack: posted ack comment on ${REPO}#${PR}"
          else
            echo "ack: could not comment on ${REPO}#${PR} (no usable gh auth on the runner? set repo secret QA_ACK_PAT) — non-blocking"
          fi
          exit 0

      - name: Validate payload, map author, and dispatch QA auto-review
        env:
          REPO: ${{ github.event.client_payload.repo }}
          PR: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          AUTHOR: ${{ github.event.client_payload.author }}
          BASE: ${{ github.event.client_payload.base }}
          IS_DRAFT: ${{ github.event.client_payload.is_draft }}
          QA_ACK_PAT: ${{ secrets.QA_ACK_PAT }}
        run: |
          set -euo pipefail

          # --- Repo allowlist: only these Muso-AI repos may drive an external
          #     review. ONE source of truth, shared with the ack step above —
          #     adding a repo = one line in that file + a Slack-UID mapping. ----
          if ! bash scripts/lib/qa-external-repo-allowlist.sh "$REPO"; then
            echo "repo='$REPO' not in the external-review allowlist — refusing."; exit 1
          fi

          # --- Format validation (defense-in-depth; the dispatcher re-checks). -
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "pr_number='$PR' not numeric — refusing."; exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "head_sha='$HEAD_SHA' not a 7-40 char hex sha — refusing."; exit 1
          fi

          # --- Scope: PRs targeting develop, main, or master, non-draft. -------
          #     (core-backend's stable branch is master; no other onboarded repo
          #     uses master, so accepting it here is purely additive.)
          if [ "$BASE" != "develop" ] && [ "$BASE" != "main" ] && [ "$BASE" != "master" ]; then
            echo "PR #${PR} base='$BASE' (not develop/main/master) — skipping."; exit 0
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #${PR} is a draft — skipping."; exit 0
          fi

          # --- Re-resolve the PR's REAL author server-side. --------------------
          #     client_payload.author is attacker-controlled (see the trust-model
          #     header): it selects the requester UID, which selects the approval
          #     TIER in qa-pr-approve.sh. Ask GitHub who actually opened the PR and
          #     refuse on any disagreement, so a forged or stale dispatch cannot
          #     buy itself somebody else's authority.
          #
          #     Same credential chain as the ack step above: QA_ACK_PAT if the repo
          #     secret is set, else the runner's ambient adk47 gh login. FAIL
          #     CLOSED — a gate that skips what it cannot verify IS the bug, so an
          #     unreadable author ends the run non-zero and loudly, never "proceed
          #     with the payload value".
          if [ -n "${QA_ACK_PAT:-}" ]; then export GH_TOKEN="$QA_ACK_PAT"; fi
          #     `gh`'s own stderr lands in the run log; the variable keeps stdout
          #     only, so an error string can never be mistaken for a login.
          REAL_AUTHOR=""
          if ! REAL_AUTHOR="$(gh api "repos/${REPO}/pulls/${PR}" --jq .user.login)" \
             || [ -z "$REAL_AUTHOR" ]; then
            echo "::error::could not read the real author of ${REPO}#${PR} from the GitHub API — refusing to dispatch on the unverified client_payload author (fail closed). Check QA_ACK_PAT / the runner's gh login."
            exit 1
          fi
          if [ "$REAL_AUTHOR" != "$AUTHOR" ]; then
            echo "::error::client_payload.author='${AUTHOR}' but ${REPO}#${PR} is really authored by '${REAL_AUTHOR}' — refusing this dispatch (forged or stale payload). The author decides the requester UID and therefore the approval tier, so a mismatch is never dispatched."
            exit 1
          fi

          # --- Author -> Slack UID. Fail-CLOSED: skip a PR we cannot DM. --------
          #     Mapped from REAL_AUTHOR, never from the payload value.
          if ! REQUESTER_UID="$(bash scripts/lib/qa-author-slack-uid.sh "$REAL_AUTHOR")"; then
            echo "PR #${PR} author='$REAL_AUTHOR' has no Slack-UID mapping — skipping (add it to scripts/lib/qa-author-slack-uid.sh to enable)."
            exit 0
          fi

          echo "Dispatching QA auto-review of ${REPO}#${PR} @ ${HEAD_SHA} (author=${REAL_AUTHOR} -> ${REQUESTER_UID})"
          bash scripts/qa-dispatch-pr-review.sh "$PR" "$HEAD_SHA" "$REPO" "$REQUESTER_UID"
