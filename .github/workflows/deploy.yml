name: Deploy HYDRA

on:
  push:
    branches: [main]

# Serialize deploys: without this, a queued run for an OLDER commit can start
# after a newer commit's run finishes and rsync the stale tree over node-8
# (happened 2026-06-11: run #310 (5beef45) deployed after #311 (604d862),
# reverting PR #487 on the server). cancel-in-progress stays false so an
# in-flight deploy is never killed mid-rsync; GitHub keeps only the newest
# pending run in the group, which is exactly the ordering we want.
concurrency:
  group: deploy-hydra
  cancel-in-progress: false

env:
  SLACK_WEBHOOK: ${{ secrets.HYDRA_SLACK_WEBHOOK }}

jobs:
  deploy:
    runs-on: [self-hosted, hydra]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: Step 4a's baseline-aware skill-drift check resolves
          # `git show <.deployed-sha>:<path>`, and that baseline can lag main by
          # more than one commit. rollback.sh also needs the last-known-good
          # commit present locally to materialize it. Also required by "Refuse
          # stale deploys" below, whose merge-base check needs full ancestry —
          # reusing this existing full clone is the least invasive option (no
          # second fetch step needed).
          fetch-depth: 0

      - name: Check deploy notification path
        run: |
          # Deploy notifications go through `muso slack send --bot devops`
          # (scripts/lib/slack-notify.sh) — the same path the watchdogs use,
          # with the bot token in /etc/openclaw/main.env on node-8.
          #
          # This replaced a raw curl to $HYDRA_SLACK_WEBHOOK. That secret has
          # NEVER existed on this repo, so every deploy notification since the
          # workflow was written silently dropped — including the failure page.
          # The old step warned about the missing secret on every single run,
          # which trained everyone to ignore the annotation.
          #
          # Non-blocking on purpose: a broken notifier must not stop a deploy.
          # It fails LOUD as a warning annotation instead of dropping silently.
          set +e
          . scripts/lib/slack-notify.sh 2>/dev/null
          if command -v slack_load_env >/dev/null 2>&1 && slack_load_env devops >/dev/null 2>&1; then
            echo "✓ deploy notifications will post via muso slack send --bot devops"
          else
            echo "::warning::Slack notify path unavailable (slack-notify.sh / MUSO_SLACK_BOT_TOKEN_DEVOPS in /etc/openclaw/main.env). Deploy proceeds, but success/failure notifications will not post."
          fi

      - name: Refuse stale deploys
        # Incident 2026-07-23 (run 29992449557): a push-event run for OLDER
        # commit 23dd1cd9 was created at 08:48, 3 minutes AFTER newer commit
        # cf5859fc4's run (created 08:45) had already deployed — delayed
        # push-event delivery let the older run start after the newer one
        # finished, and it rsynced the stale tree over /opt/hydra
        # (workflow-green, silently wrong content). The `concurrency` group
        # above serializes runs but does not reorder or drop them, so it
        # did not catch this. This step compares the checked-out commit
        # (github.sha) against the current tip of origin/main and refuses to
        # deploy a commit main has already moved past. The decision logic
        # (including the diverged-history case QA flagged on PR #731) lives
        # in scripts/lib/deploy-stale-guard.sh so it's unit-testable — see
        # scripts/tests/deploy-stale-guard.bats.
        id: stale_check
        env:
          HYDRA_ALLOW_STALE_DEPLOY: ${{ vars.HYDRA_ALLOW_STALE_DEPLOY }}
        run: |
          git fetch origin main --quiet
          TIP=$(git rev-parse origin/main)
          CUR=$(git rev-parse HEAD)
          chmod +x scripts/lib/deploy-stale-guard.sh
          ./scripts/lib/deploy-stale-guard.sh "$CUR" "$TIP" >> "$GITHUB_OUTPUT"

      - name: Detect deploy target
        id: detect
        if: steps.stale_check.outputs.proceed == 'true'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
            echo "Deploy target: all (unable to detect changes)"
            exit 0
          fi

          NEEDS_MAIN=false
          NEEDS_EDGE=false

          while IFS= read -r file; do
            case "$file" in
              openclaw-edge.json|plugins/intercom/*|plugins/support-tools/*|workspaces/support/*)
                NEEDS_EDGE=true ;;
              openclaw-main.json|workspaces/ceo/*|workspaces/cmo/*|workspaces/cto/*|workspaces/coordinator/*|workspaces/qa/*|workspaces/finance/*|workspaces/operations/*|workspaces/devops/*|workspaces/scout/*|workspaces/neutral/*)
                NEEDS_MAIN=true ;;
              scripts/*|policies/*|skills-all/*|.github/workflows/*)
                NEEDS_MAIN=true; NEEDS_EDGE=true ;;
              plugins/*)
                NEEDS_MAIN=true ;;
            esac
          done <<< "$CHANGED"

          # Build comma-separated target from flags
          TARGETS=""
          $NEEDS_MAIN && TARGETS="${TARGETS:+$TARGETS,}main"
          $NEEDS_EDGE && TARGETS="${TARGETS:+$TARGETS,}edge"

          # Default to all if nothing matched
          TARGET="${TARGETS:-all}"
          # Simplify: if both profiles are set, just use "all"
          if [ "$TARGET" = "main,edge" ]; then TARGET="all"; fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Deploy target: $TARGET"
          echo "Changed files:"
          echo "$CHANGED"

      # Note: mention gate patch removed — no longer needed on OpenClaw 2026.4.2+

      - name: Deploy with target
        id: deploy
        if: steps.stale_check.outputs.proceed == 'true'
        run: |
          echo "::group::Running deploy script"
          TARGET="${{ steps.detect.outputs.target }}"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh --target "$TARGET"
          echo "::endgroup::"

      # Smoke test runs inside deploy.sh (step 7) and fails the deploy on failure.
      # No separate CI smoke test step needed — avoids double-run and the
      # continue-on-error silencing issue.

      - name: Post to Slack — success
        if: success() && steps.stale_check.outputs.proceed == 'true'
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR="${{ github.actor }}"
          TARGET="${{ steps.detect.outputs.target }}"

          # Posts via `muso slack send --bot devops` (same path the watchdogs
          # use). The former raw-curl-to-$SLACK_WEBHOOK was a permanent no-op:
          # HYDRA_SLACK_WEBHOOK has never existed on this repo.
          set +e
          . scripts/lib/slack-notify.sh
          MSG=$(printf '%s\n%s\n%s\n%s' \
            ":white_check_mark: *HYDRA Deploy Successful* (target: ${TARGET})" \
            "*Commit:* \`${COMMIT_SHA:0:7}\` — ${COMMIT_MSG}" \
            "*Author:* ${AUTHOR}" \
            "*Time:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')")
          bash scripts/lib/deploy-notify.sh success "$MSG" \
            || echo "::warning::Deploy succeeded but the Slack notification did not post."

      - name: Rollback on failure
        if: failure() && steps.stale_check.outputs.proceed == 'true'
        run: |
          echo "::error::Deployment failed — initiating rollback"
          if [ -f scripts/rollback.sh ]; then
            chmod +x scripts/rollback.sh
            ./scripts/rollback.sh || echo "Rollback script failed"
          fi
          # deploy-notify.sh prepends REAL <@UID> mentions for Nick and Aaron
          # and RETURNS the true delivery status. The former payload hardcoded
          # the literal "<@aaron>" (Slack renders that as plain text and pings
          # nobody) and curled an unset webhook, so deploy failures were
          # entirely silent — that is how 2026-08-06's blocked deploy went
          # unnoticed. A page that cannot report its own failure is the same
          # bug one level up, so a non-zero here escalates to ::error::.
          set +e
          MSG=$(printf '%s\n%s\n%s\n%s\n%s' \
            ":rotating_light: *HYDRA Deploy FAILED* (target: ${{ steps.detect.outputs.target }})" \
            "*Commit:* \`${{ github.sha }}\`" \
            "*Author:* ${{ github.actor }}" \
            "*Action:* Rollback initiated" \
            "*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          bash scripts/lib/deploy-notify.sh critical "$MSG" \
            || echo "::error::Deploy FAILED and the Slack page did NOT post — nobody was notified. Check MUSO_SLACK_BOT_TOKEN_DEVOPS in /etc/openclaw/main.env and the devops bot's channel membership."
