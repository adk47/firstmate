name: Deploy HYDRA

on:
  push:
    branches: [main]

env:
  KUBECONFIG: /root/.kube/config
  SLACK_WEBHOOK: ${{ secrets.HYDRA_SLACK_WEBHOOK }}
  HYDRA_NAMESPACE: hydra

jobs:
  deploy:
    runs-on: [self-hosted, hydra]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync config to Node 8
        run: |
          echo "::group::Syncing HYDRA config"
          /usr/bin/rsync -avz --delete \
            --exclude='.git' \
            --exclude='ui/node_modules' \
            --exclude='ui/.next' \
            --exclude='skills-all' \
            ./ /opt/hydra/config/
          echo "Config synced to /opt/hydra/config/"
          echo "::endgroup::"

      - name: Sync workspaces to live
        run: |
          echo "::group::Syncing workspaces"
          # Sync SOUL.md, TOOLS.md, AGENTS.md (policy files) to live workspaces
          # Preserve MEMORY.md and other agent-written files
          for ws in ceo cmo coordinator cto design devops finance neutral operations qa support; do
            src="workspaces/${ws}/"
            dst="/opt/hydra/workspaces/${ws}/"
            if [ -d "$src" ] && [ -d "$dst" ]; then
              /usr/bin/rsync -avz --exclude='MEMORY.md' "$src" "$dst"
            elif [ -d "$src" ]; then
              mkdir -p "$dst"
              /usr/bin/rsync -avz "$src" "$dst"
            fi
          done
          echo "Workspaces synced"
          echo "::endgroup::"

      - name: Apply K8s manifests
        id: apply
        run: |
          echo "::group::Applying K8s manifests"

          # Snapshot current state for rollback
          /usr/local/bin/kubectl get deployments -n ${HYDRA_NAMESPACE} -o yaml > /tmp/hydra-rollback-deployments.yaml 2>/dev/null || true
          /usr/local/bin/kubectl get configmaps -n ${HYDRA_NAMESPACE} -o yaml > /tmp/hydra-rollback-configmaps.yaml 2>/dev/null || true

          # Apply all HYDRA manifests (only if k8s dir exists in repo)
          if [ -d "k8s/prod/hydra/" ]; then
            /usr/local/bin/kubectl apply -f k8s/prod/hydra/ --namespace=${HYDRA_NAMESPACE}
          else
            echo "No k8s manifests in repo — skipping"
          fi

          echo "K8s manifests applied"
          echo "::endgroup::"

      - name: Install plugins
        run: |
          echo "::group::Installing plugins"
          # Install any plugins in the plugins/ directory
          if [ -d "plugins/" ]; then
            for plugin_dir in plugins/*/; do
              plugin_name=$(basename "$plugin_dir")
              if [ -f "${plugin_dir}package.json" ]; then
                echo "Installing plugin: ${plugin_name}"
                cd "${plugin_dir}" && npm install --production 2>&1 | tail -3 && cd -
                # Register with OpenClaw if not already installed
                if [ ! -d "/root/.openclaw/extensions/${plugin_name}" ]; then
                  cp -r "${plugin_dir}" "/root/.openclaw/extensions/${plugin_name}"
                  echo "Registered ${plugin_name} in OpenClaw extensions"
                else
                  rsync -az --exclude='node_modules' "${plugin_dir}" "/root/.openclaw/extensions/${plugin_name}/"
                  echo "Updated ${plugin_name} in OpenClaw extensions"
                fi
              fi
            done
          fi
          echo "::endgroup::"

      - name: Apply patches
        run: |
          echo "::group::Applying patches"
          # Apply mention gate patch (until openclaw/openclaw#53161 is merged upstream)
          if [ -f scripts/patch-openclaw-mention-gate.sh ]; then
            chmod +x scripts/patch-openclaw-mention-gate.sh
            bash scripts/patch-openclaw-mention-gate.sh
          fi
          echo "::endgroup::"

      - name: Restart OpenClaw Gateway
        id: restart
        run: |
          echo "::group::Restarting OpenClaw Gateway"
          # OpenClaw runs as systemd service on Node 8 (not K8s)
          if systemctl is-active openclaw-gateway &>/dev/null; then
            systemctl restart openclaw-gateway
            sleep 5
            if systemctl is-active openclaw-gateway &>/dev/null; then
              echo "OpenClaw Gateway restarted successfully (systemd)"
            else
              echo "::error::Gateway failed to start after restart"
              journalctl -u openclaw-gateway --no-pager -n 20
              exit 1
            fi
          elif /usr/local/bin/kubectl get deployment/openclaw-gateway -n ${HYDRA_NAMESPACE} &>/dev/null; then
            /usr/local/bin/kubectl rollout restart deployment/openclaw-gateway -n ${HYDRA_NAMESPACE}
            /usr/local/bin/kubectl rollout status deployment/openclaw-gateway -n ${HYDRA_NAMESPACE} --timeout=300s
            echo "OpenClaw Gateway restarted successfully (kubectl)"
          else
            echo "::warning::No gateway found (systemd or kubectl) — skipping restart"
          fi
          echo "::endgroup::"

      - name: Run smoke test
        id: smoke
        continue-on-error: true
        run: |
          echo "::group::Running smoke tests"
          if [ -f scripts/smoke-test.sh ]; then
            chmod +x scripts/smoke-test.sh
            ./scripts/smoke-test.sh || echo "::warning::Smoke tests failed (non-blocking — gateway runs as Docker, not K8s)"
          else
            echo "No smoke-test.sh found — skipping"
          fi
          echo "::endgroup::"

      - name: Post to Slack — success
        if: success()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR="${{ github.actor }}"

          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":white_check_mark: HYDRA deployed successfully\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":white_check_mark: *HYDRA Deploy Successful*\n\n*Commit:* \`${COMMIT_SHA:0:7}\` — ${COMMIT_MSG}\n*Author:* ${AUTHOR}\n*Time:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')\"
                  }
                }
              ]
            }" || echo "Slack notification failed (non-fatal)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment failed — initiating rollback"

          # Run rollback script if it exists
          if [ -f scripts/rollback.sh ]; then
            chmod +x scripts/rollback.sh
            ./scripts/rollback.sh || echo "Rollback script failed"
          fi

          # Restore previous deployments if snapshot exists
          if [ -f /tmp/hydra-rollback-deployments.yaml ]; then
            /usr/local/bin/kubectl apply -f /tmp/hydra-rollback-deployments.yaml --namespace=${HYDRA_NAMESPACE} || true
          fi

          # Notify Aaron
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":rotating_light: HYDRA deployment FAILED — rollback initiated\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":rotating_light: *HYDRA Deploy FAILED*\n\n*Commit:* \`${{ github.sha }}\`\n*Author:* ${{ github.actor }}\n*Action:* Rollback initiated\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n<@aaron> — please investigate\"
                  }
                }
              ]
            }" || echo "Slack notification failed (non-fatal)"
