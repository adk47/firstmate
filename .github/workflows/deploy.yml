name: Deploy HYDRA

on:
  push:
    branches: [main]

# Serialize deploys: without this, a queued run for an OLDER commit can start
# after a newer commit's run finishes and rsync the stale tree over node-8
# (happened 2026-06-11: run #310 (5beef45) deployed after #311 (604d862),
# reverting PR #487 on the server). cancel-in-progress stays false so an
# in-flight deploy is never killed mid-rsync; GitHub keeps only the newest
# pending run in the group, which is exactly the ordering we want.
concurrency:
  group: deploy-hydra
  cancel-in-progress: false

env:
  KUBECONFIG: /root/.kube/config
  SLACK_WEBHOOK: ${{ secrets.HYDRA_SLACK_WEBHOOK }}
  HYDRA_NAMESPACE: hydra

jobs:
  deploy:
    runs-on: [self-hosted, hydra]
    steps:
      - name: Check SLACK_WEBHOOK presence
        run: |
          # Non-blocking presence check. If the secret is missing, deploys
          # still run — but every notify_slack call will silently drop,
          # meaning no Slack visibility into failures. This step surfaces
          # the rot as a GitHub Actions warning annotation so it's visible
          # in the Actions UI without blocking the pipeline.
          #
          # To stop this warning firing: get the #hydra-heartbeat webhook
          # URL from Slack app settings and run
          #     gh secret set HYDRA_SLACK_WEBHOOK --repo Muso-AI/hydra
          #
          # This step was originally a fail-fast (exit 1) but was softened
          # so PR #68 could merge before Aaron returned the webhook URL.
          # If you want to re-harden it into a hard gate, change the
          # '::warning::' below to '::error::' and add 'exit 1'.
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::warning::HYDRA_SLACK_WEBHOOK secret is empty or missing — deploy will proceed but Slack notifications will be dropped. Fix at https://github.com/Muso-AI/hydra/settings/secrets/actions (ask Aaron for the #hydra-heartbeat webhook URL, then: gh secret set HYDRA_SLACK_WEBHOOK --repo Muso-AI/hydra)"
          else
            echo "✓ SLACK_WEBHOOK is set (length: ${#SLACK_WEBHOOK})"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: Step 4a's baseline-aware skill-drift check resolves
          # `git show <.deployed-sha>:<path>`, and that baseline can lag main by
          # more than one commit. (HEAD~1 target detection still works.)
          fetch-depth: 0

      - name: Detect deploy target
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
            echo "Deploy target: all (unable to detect changes)"
            exit 0
          fi

          NEEDS_MAIN=false
          NEEDS_EDGE=false

          while IFS= read -r file; do
            case "$file" in
              openclaw-edge.json|plugins/intercom/*|plugins/support-tools/*|workspaces/support/*)
                NEEDS_EDGE=true ;;
              openclaw-main.json|workspaces/ceo/*|workspaces/cmo/*|workspaces/cto/*|workspaces/coordinator/*|workspaces/qa/*|workspaces/finance/*|workspaces/operations/*|workspaces/devops/*|workspaces/scout/*|workspaces/neutral/*)
                NEEDS_MAIN=true ;;
              scripts/*|policies/*|skills-all/*|.github/workflows/*)
                NEEDS_MAIN=true; NEEDS_EDGE=true ;;
              plugins/*)
                NEEDS_MAIN=true ;;
            esac
          done <<< "$CHANGED"

          # Build comma-separated target from flags
          TARGETS=""
          $NEEDS_MAIN && TARGETS="${TARGETS:+$TARGETS,}main"
          $NEEDS_EDGE && TARGETS="${TARGETS:+$TARGETS,}edge"

          # Default to all if nothing matched
          TARGET="${TARGETS:-all}"
          # Simplify: if both profiles are set, just use "all"
          if [ "$TARGET" = "main,edge" ]; then TARGET="all"; fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Deploy target: $TARGET"
          echo "Changed files:"
          echo "$CHANGED"

      # Note: mention gate patch removed — no longer needed on OpenClaw 2026.4.2+

      - name: Deploy with target
        id: deploy
        run: |
          echo "::group::Running deploy script"
          TARGET="${{ steps.detect.outputs.target }}"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh --target "$TARGET"
          echo "::endgroup::"

      # Smoke test runs inside deploy.sh (step 7) and fails the deploy on failure.
      # No separate CI smoke test step needed — avoids double-run and the
      # continue-on-error silencing issue.

      - name: Post to Slack — success
        if: success()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR="${{ github.actor }}"
          TARGET="${{ steps.detect.outputs.target }}"

          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":white_check_mark: HYDRA deployed successfully (target: ${TARGET})\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":white_check_mark: *HYDRA Deploy Successful* (target: ${TARGET})\n\n*Commit:* \`${COMMIT_SHA:0:7}\` — ${COMMIT_MSG}\n*Author:* ${AUTHOR}\n*Time:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')\"
                  }
                }
              ]
            }" || echo "Slack notification failed (non-fatal)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment failed — initiating rollback"
          if [ -f scripts/rollback.sh ]; then
            chmod +x scripts/rollback.sh
            ./scripts/rollback.sh || echo "Rollback script failed"
          fi
          if [ -f /tmp/hydra-rollback-deployments.yaml ]; then
            /usr/local/bin/kubectl apply -f /tmp/hydra-rollback-deployments.yaml --namespace=${HYDRA_NAMESPACE} || true
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":rotating_light: HYDRA deployment FAILED — rollback initiated\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":rotating_light: *HYDRA Deploy FAILED* (target: ${{ steps.detect.outputs.target }})\n\n*Commit:* \`${{ github.sha }}\`\n*Author:* ${{ github.actor }}\n*Action:* Rollback initiated\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n<@aaron> — please investigate\"
                  }
                }
              ]
            }" || echo "Slack notification failed (non-fatal)"
