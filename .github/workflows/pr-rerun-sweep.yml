name: PR re-run sweep

# Re-runs, in place, the check that holds a VALIDATED head for no reason of its code.
#
# WHY THIS EXISTS (2026-11-13, measured): of 177 open PRs on main, 24 were held by a check whose
# red or cancelled result a re-run of its failed jobs clears, and nothing performed that re-run:
#   - 3 heads whose suite is green but whose required `validate` is red, because a title/body-edit
#     run (the NEWER run, so the one GitHub grades) failed before the suite finished;
#   - 21 heads whose `credit-approval-guard` is red or cancelled on one of its two events although
#     the PR body passes the guard today.
# `scripts/pr-doctor.py plan N --apply` has cleared exactly these since #1935, but only when a
# person ran it. hydra#1886 sat validated and unmergeable for four days. The other way out, an
# empty commit, re-runs 20-60 minutes of CI and throws away the head's QA verdict.
#
# WHAT IT DOES: when a PR Validation run completes (and every 2 hours, as the net under a lost
# event), it asks `pr-doctor.plan_pr` what is holding the head and performs that plan's re-run:
# `POST /actions/runs/{id}/rerun-failed-jobs`, at most one per PR per pass.
#
# WHAT IT CANNOT DO. It holds `actions: write` and nothing else that writes: it cannot merge,
# push, edit a PR, post a status or create a check. A re-run reports what is true, so it cannot
# turn an unvalidated head green. The rule that an unvalidated head cannot merge is untouched: the
# planner never offers a re-run for a suite that FAILED (a person reads that first), for a head
# that conflicts, or for a QA NO-GO. Pinned by scripts/tests/test_pr_rerun_sweep.py.
#
# NO LOOP: a run is re-run at most twice (`MAX_ATTEMPTS` = 3 in the script). A run that is
# cancelled or fails the same way a third time is reported as a warning and left for a person.
#
# KILL SWITCH: set the repository variable PR_RERUN_SWEEP_DISABLED to 1 (or disable this
# workflow). Nothing depends on it: every re-run it performs is one a person can perform with
# `scripts/pr-doctor.py plan N --apply`.
#
# workflow_run and schedule both run the DEFAULT-branch copy of this file, and the checkout below
# is pinned to the default branch, so a PR branch can change neither the trigger nor the planner.

run-name: "re-run sweep: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.pr && format('PR {0}', inputs.pr) || 'all open PRs') }}"

on:
  workflow_run:
    # Must match the validation workflow's `name:` ("PR Validation"), NOT its filename.
    workflows: ["PR Validation"]
    types: [completed]
  schedule:
    # The net under a lost or skipped event, and the only trigger for a guard red that no PR
    # Validation run follows. About 280 API reads for 177 open PRs (measured 2026-11-13).
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to sweep (empty = every open PR on main that GitHub shows as red)"
        required: false
        type: string
      dry_run:
        description: "Print the plan and re-run nothing"
        required: false
        type: boolean
        default: false

permissions:
  actions: write # re-run failed jobs; the only write this workflow has
  checks: read
  contents: read
  pull-requests: read
  statuses: read

# One pass per PR at a time, and a superseded pass is CANCELLED rather than queued.
#
# The group is the PR, not the head. A pass for a head the PR has already moved past is stale work:
# the pass for the newer head re-reads the same PR and covers it, and a re-run it had not requested
# yet is requested by the newer pass. A dispatch names its PR; a scheduled `--all` pass is its own
# group, so it never cancels a PR pass. The `pr-rerun-sweep-` prefix keeps this group out of every
# other workflow's (deploy, validation, title check), so nothing here can cancel a run of main or a
# deploy.
#
# The PR-supplied part of the key is NAMESPACED and identifies the PR, not just a branch name. A
# branch name is not an identity: two fork PRs can both be `fix`, and a pass for one would cancel
# the other's needed re-run (QA review of #2089). So the key is, in order:
#   pr-<number>          the PR `workflow_run.pull_requests` names (absent for a fork PR)
#   fork-<repo id>-<ref> its head repository's numeric id and its head branch (the id separates forks)
#   pr-<number>          a `workflow_dispatch` that names a PR
#   net                  the scheduled `--all` pass, and a bare `--all` dispatch
# The `pr-`/`fork-` namespacing also keeps the net's own key unreachable: a branch is a name
# anybody can choose, and the net is the one pass that is not cancellable, so a branch that joined
# it would share the group's single slot and the net would wait behind a pass that keeps being
# replaced.
#
# Residual, not removable in an expression: two branches of the SAME repository that differ only by
# case (`Fix` and `fix`) can still alias if GitHub compares group names case-insensitively. That is
# one repository, so both would be the same head repository id; a hash is not available to a
# workflow expression, and lowercasing would merge two real branches instead of separating them.
#
# Measured 2026-11-16T04:5xZ: 18 sweep passes were queued on the fleet, 17 of them for 17 distinct
# heads (12 open PRs, 5 heads whose PR had already closed). Each is ~8 s of python and API reads, so
# a stale one is a queue slot spent on a verdict the newer pass is about to reach anyway.
#
# The scheduled `--all` net is deliberately NOT cancellable. In the 18 h to 2026-11-16T05:00Z the
# scheduled pass waited 1h15m-2h38m for a runner (job created_at -> started_at) while the cron fires
# every 2 h, so a cancellable net is a net each tick cancels while it is still waiting: it can be
# starved for as long as the pool stays saturated. It is also the only trigger for a credit-guard
# red that no PR Validation run follows. GitHub already holds a group to one running plus one
# pending, so the net was never the pile-up and needs no cancellation to stay bounded.
concurrency:
  group: pr-rerun-sweep-${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event_name == 'workflow_run' && format('fork-{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) || github.event.inputs.pr != '' && format('pr-{0}', github.event.inputs.pr) || 'net' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.pr != '') }}

jobs:
  pr-rerun-sweep:
    name: pr-rerun-sweep
    if: vars.PR_RERUN_SWEEP_DISABLED != '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    # In-cluster ARC, off node-8 (see the note above `validate` in pr-validate.yml). python3 only.
    runs-on: ovh-hydra
    timeout-minutes: 15
    steps:
      - name: Checkout the planner (default branch, never PR code)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/pr-rerun-sweep.py
            scripts/pr-doctor.py
            .github/credit-approval/guard.py
          sparse-checkout-cone-mode: false

      - name: Re-run what is holding a validated head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO")
          case "$EVENT_NAME" in
            workflow_run)
              args+=(--sha "$HEAD_SHA")
              ;;
            workflow_dispatch)
              if [ -n "$INPUT_PR" ]; then
                [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got '$INPUT_PR'"; exit 2; }
                args+=(--pr "$INPUT_PR")
              else
                args+=(--all)
              fi
              ;;
            *)
              args+=(--all)
              ;;
          esac
          if [ "$INPUT_DRY_RUN" != "true" ]; then
            args+=(--apply)
          fi
          python3 scripts/ci/pr-rerun-sweep.py "${args[@]}"
