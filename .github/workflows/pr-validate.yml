        # These lock the load-bearing de-confliction invariant (exclude by
        # conversation id across ALL sibling sweeper states — a missed
        # exclusion double-messages a customer), the 3-verb allowlist on
        # --append-record, host-guarded shadow-log appends, and PII masking.
