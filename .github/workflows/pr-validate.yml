  plugin-tests:
    name: Plugin tests (vitest)
    if: github.event.action != 'edited' || github.event.changes.base != null
    # Added 2026-05-20: 3 plugins under plugins/ (intercom, support-tools,
    # muso-credit-verification-enforcer) ship test files that never ran
    # in CI before this PR. PR #297's TypeScript changes in
    # create-ticket.ts could only be verified by running `pnpm test`
    # locally. With this job, plugin regressions surface at PR time.
    #
    # Runs `pnpm build` + `dist/index.js` existence + `pnpm test` for
    # every in-tree plugin. The build gate catches the 2026.5.19 plugin-
    # loading regression: openclaw stopped accepting `./src/index.ts`
    # as a runtime entry, requiring compiled `dist/index.js`. Without
    # this CI check the failure only surfaces post-deploy when the
    # gateway can't load the plugin (incident PR #302).
    # 2026-10-27: ovh-hydra (see the note above `validate`); node + pnpm come from
    # scripts/ci/arc-toolchain.sh at node-8's versions.
    runs-on: ovh-hydra
    # Bound the job, not just the step: GitHub's default job timeout is 6 h,
    # so a single hung test can hold a runner for six hours (measured 2026-11-06:
    # one Bats case spun at 99.6% CPU for 72 min inside an 82-min run).
    timeout-minutes: 30
    # Until 2026-10-27 this job ran ON node-8, as root, where /etc/hydra/jev.env holds the real Jev
    # key and /var/lib/hydra-jev/shadow is the PRODUCTION shadow log that the
    # Phase 3 decisions are made from. Any test that reaches a real jev.sh or a
    # default shadow path without overriding it would make a real API call
    # with fixture data and append that row to production. It did: 2026-09-23
    # found 181 fixture rows there, some with rc 0 from real calls, including
    # rows written by this job after #1013 merged. These defaults fence every
    # test in this job off at once; a test that needs a key or a dir still sets
    # its own, which overrides these.
    env:
      JEV_ENV_FILE: /dev/null
      JEV_SHADOW_DIR: /tmp/hydra-ci-jev-shadow-${{ github.run_id }}-${{ github.job }}
      JEV_EVAL_DIR: /tmp/hydra-ci-jev-eval-${{ github.run_id }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh
      - name: Ensure node + pnpm available
        # The runner image ships node 20 and no pnpm; the gateway on node-8 runs node 24 and
        # this job used to borrow it. scripts/ci/arc-toolchain.sh installs node-8's node and
        # pnpm versions into the runner's home and puts them on PATH for later steps.
        run: bash scripts/ci/arc-toolchain.sh node
      - name: Caroline answer-bank doctrine gate (one versioned set of approved lines)
        # caroline-guard-g1: every line in plugins/intercom/src/answer-bank.ts is in its workspace anchor
        # verbatim, pending copy PRs are not already live, and a copy change bumps BANK_VERSION + the pin.
        # Needs node >= 22.6 (--experimental-strip-types), hence this job. --base: the bank at the PR base is the
        # independent monotonic source, so changed lines without a BANK_VERSION bump fail even when the pin moved.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/answer-bank-base"
          bash scripts/check-caroline-answer-bank.sh --base origin/answer-bank-base
      - name: deploy install path matches CI (pnpm --frozen-lockfile)
        # Guards the #385 / Deploy HYDRA #217 class-of-bug: this CI job
        # installs plugins with `pnpm install --frozen-lockfile` (pinned,
        # reproducible), but if deploy.sh install_plugin() ever reverts to
        # bare `npm install` it free-resolves version ranges and can pull
        # an unpublished transitive dep (the 2026-06-01 vite-node@3.2.5
        # ETARGET that aborted the post-merge deploy). CI was green the
        # whole time because it used the lockfile — i.e. "CI green" had
        # silently stopped implying "deploy installs cleanly". This step
        # re-couples them: it FAILS if install_plugin() doesn't install via
        # `pnpm install --frozen-lockfile`, or if a bare `npm install`
        # (no -g) creeps back into that function. Cheap structural assert,
        # not a runtime test.
        run: |
          set -euo pipefail
          if ! grep -q 'install_plugin()' scripts/deploy.sh; then
            echo "::error::could not find install_plugin() in scripts/deploy.sh — this guard's assumptions changed; review the deploy plugin-install path"
            exit 1
          fi
          # Extract the install_plugin() function body (def line → next top-level
          # `}` at column 0), then STRIP COMMENTS. Both checks below operate on
          # comment-free code so the function's own explanatory comments (which
          # quote both "pnpm install --frozen-lockfile" AND "bare npm install")
          # can't satisfy/trip the asserts. QA on PR #389 caught that the prior
          # version grepped the raw body — a revert to `npm ci` with comments
          # intact would pass. We now anchor to the EXECUTABLE install command:
          # the `$(cd "$plugin_dir" && <pkg-manager> …)` command-substitution,
          # a form that appears only in real code, never in comments/log strings.
          # NOTE: capture grep output into a var with `|| true` and test `-n`,
          # rather than piping into `grep -q` — under `set -euo pipefail` a
          # `grep -q` early-exit SIGPIPEs the upstream grep and muddies the
          # pipeline status. Capture-then-test is deterministic.
          code=$(awk '/^install_plugin\(\) \{/{f=1} f{print} f&&/^\}/{exit}' scripts/deploy.sh | sed 's/#.*//')
          if [ -z "$code" ]; then
            echo "::error::failed to extract install_plugin() body from scripts/deploy.sh"
            exit 1
          fi
          # Positive: the dependency-install command must be an executable
          # `$(cd "$plugin_dir" && pnpm install --frozen-lockfile …)`.
          pnpm_ok=$(printf '%s\n' "$code" | grep -E '\$\(cd "\$plugin_dir" && pnpm install --frozen-lockfile' || true)
          if [ -z "$pnpm_ok" ]; then
            echo "::error::scripts/deploy.sh install_plugin() must run 'pnpm install --frozen-lockfile' as its dependency-install command (mirrors this CI job). It does not — see PR #385 / Deploy HYDRA #217: bare 'npm install' free-resolves ranges and ETARGETs on unpublished transitive deps. Do NOT revert to npm install / npm ci / --omit=dev / yarn."
            exit 1
          fi
          # Negative: NO `$(cd "$plugin_dir" && …)` install-style command may use
          # npm / yarn / bun (catches `npm install`, `npm ci`, `yarn`, `bun i`).
          # The global `npm install -g openclaw` in install_openclaw() is a
          # different function and not matched by this anchor.
          bad_pm=$(printf '%s\n' "$code" | grep -E '\$\(cd "\$plugin_dir" && (npm|yarn|bun)\b' || true)
          if [ -n "$bad_pm" ]; then
            echo "::error::scripts/deploy.sh install_plugin() runs a non-pnpm package manager in its install command — that's the #217 regression class. Use 'pnpm install --frozen-lockfile'. Offending line(s): $bad_pm"
            exit 1
          fi
          echo "✓ deploy.sh install_plugin() installs via 'pnpm install --frozen-lockfile' (matches CI; npm/npm ci/yarn/bun rejected)"
      - name: openclaw version alignment (deploy.sh vs plugin lockfiles)
        # Catches the class-of-bug from PR #303's review: lockfile-frozen
        # `pnpm install` quietly resolves a stale openclaw, the build
        # passes against the wrong SDK, and the regression only surfaces
        # at deploy time. Procedure when this step fails: in each plugin
        # dir, `rm -rf node_modules pnpm-lock.yaml && pnpm install` to
        # regenerate against current OPENCLAW_VERSION, then commit the
        # refreshed lockfiles. Removing node_modules is REQUIRED, not
        # tidiness: with the tree still present pnpm reuses the installed
        # version and silently rewrites the SAME old pin, so the gate stays
        # red with no visible reason (observed on the 8.1 -> 8.2 bump).
        run: |
          set -euo pipefail
          DEPLOY_VER=$(grep '^OPENCLAW_VERSION=' scripts/deploy.sh \
            | sed -E 's/.*-([0-9.]+)\}.*/\1/')
          if [ -z "$DEPLOY_VER" ]; then
            echo "::error::could not parse OPENCLAW_VERSION from scripts/deploy.sh"
            exit 1
          fi
          echo "scripts/deploy.sh OPENCLAW_VERSION = $DEPLOY_VER"
          fail=0
          shopt -s nullglob
          for lock in plugins/*/pnpm-lock.yaml; do
            # Compare the FULL unique set of openclaw@<ver> entries in the
            # lockfile against DEPLOY_VER, not just the first one. A lockfile
            # can legitimately resolve multiple openclaw entries (top-level
            # peer + a transitive sub-dep) and we want any of them differing
            # from the deploy pin to fail the gate.
            LOCK_VERS=$(grep -oE 'openclaw@[0-9.]+' "$lock" | sort -u | cut -d@ -f2)
            if [ -z "$LOCK_VERS" ]; then
              echo "::warning::$lock has no openclaw pin — skipping"
              continue
            fi
            MISMATCH=$(printf '%s\n' "$LOCK_VERS" | grep -vFx "$DEPLOY_VER" || true)
            if [ -z "$MISMATCH" ]; then
              entry_count=$(printf '%s\n' "$LOCK_VERS" | wc -l | tr -d ' ')
              echo "  ✓ $lock pins openclaw@$DEPLOY_VER ($entry_count unique entr$([ "$entry_count" = "1" ] && echo y || echo ies))"
            else
              mismatch_csv=$(printf '%s\n' "$MISMATCH" | paste -sd, -)
              echo "::error::$lock contains openclaw version(s) other than $DEPLOY_VER: $mismatch_csv — regenerate with: (cd $(dirname $lock) && rm -rf node_modules pnpm-lock.yaml && pnpm install) — node_modules MUST go too, or pnpm silently re-pins the old version"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
      - name: Test each plugin
        # Discovers every plugins/*/package.json so future plugins are
        # auto-included in the build+dist gate without another CI edit.
        # Skips dirs without package.json so partial scaffolding doesn't
        # false-positive.
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for pkg in plugins/*/package.json; do
            plugin=$(dirname "$pkg")
            echo "::group::$plugin"
            pushd "$plugin" >/dev/null
            if ! pnpm install --frozen-lockfile; then
              echo "::error::$plugin: pnpm install --frozen-lockfile failed (regenerate pnpm-lock.yaml if openclaw was bumped)"
              fail=1
              popd >/dev/null
              echo "::endgroup::"
              continue
            fi
            if ! pnpm run build; then
              echo "::error::$plugin: pnpm run build failed — openclaw 2026.5.19 requires compiled dist/"
              fail=1
              popd >/dev/null
              echo "::endgroup::"
              continue
            fi
            if [ ! -f dist/index.js ]; then
              echo "::error::$plugin: dist/index.js not produced after build — openclaw 2026.5.19 will refuse to load this plugin"
              fail=1
              popd >/dev/null
              echo "::endgroup::"
              continue
            fi
            if ! pnpm test; then
              echo "::error::$plugin: pnpm test failed"
              fail=1
            fi
            popd >/dev/null
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more plugin gates failed — see groups above"
            exit 1
          fi
          echo "✓ All plugin tests pass"

  shellcheck:
    name: Shellcheck (scripts/ + .githooks/)
    if: github.event.action != 'edited' || github.event.changes.base != null
    # Was ubuntu-latest, but GitHub-hosted runners stopped being assignable
    # for this repo around 2026-04-24 (job completes in ~3s with
    # runner_id=0, runner_name="" — runner never assigned). Until that
    # org-level issue is resolved (Actions billing / runner pool), use
    # the self-hosted hydra-node8 runner the other jobs run on.
    # 2026-10-27: ovh-hydra, the in-cluster repo-level fleet (see the note above `validate`).
    runs-on: ovh-hydra
    # Bound the job, not just the step: GitHub's default job timeout is 6 h,
    # so a single hung test can hold a runner for six hours (measured 2026-11-06:
    # one Bats case spun at 99.6% CPU for 72 min inside an 82-min run).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh

      - name: Ensure shellcheck installed
        run: bash scripts/ci/arc-toolchain.sh lint

      - name: Run shellcheck on hydra bash infrastructure
        run: |
          # Lint scope: scripts/ and .githooks/ only. Agent skill
          # scripts under skills-all/ and workspaces/*/skills/ are
          # third-party-style code with their own maintenance cadence
          # and are out of scope for the hydra deploy pipeline gate.
          #
          # The .githooks/pre-commit file has no .sh extension but is
          # 370+ lines of bash and is the very tool catching bash bugs
          # — it must be in scope. Add it explicitly so the find -name
          # filter doesn't skip it.
          sh_files=$(find scripts .githooks -type f \( -name '*.sh' -o -name '*.bash' \) 2>/dev/null)
          if [ -f .githooks/pre-commit ]; then
            sh_files=$(printf '%s\n.githooks/pre-commit\n' "$sh_files")
          fi
          if [ -z "$sh_files" ]; then
            echo "No *.sh files found in scripts/ or .githooks/"
            exit 0
          fi
          echo "Linting the following files:"
          echo "$sh_files"
          echo "---"
          failed=0
          while IFS= read -r f; do
            if ! shellcheck --severity=warning "$f"; then
              failed=1
            fi
          done <<< "$sh_files"
          if (( failed != 0 )); then
            echo "::error::shellcheck found warnings or errors — fix them before merging"
            echo "::notice::The 6 bash bugs in smoke-test.sh that caused 2026-04-07's 18-failures-per-deploy cascade were all SC2126 warnings — exactly the class this gate exists to prevent."
            exit 1
          fi
          echo "✓ All *.sh files pass shellcheck --severity=warning"

      - name: Summary
        if: always()
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JSON Lint | ${{ steps.json-lint.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SOUL.md | ${{ steps.soul-check.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deny List Audit | ${{ steps.deny-audit.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CODEOWNERS | ${{ steps.codeowners.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CS Reference Scan | ${{ steps.cs-scan.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Code Review | ${{ steps.ai-review.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Egress Allowlist | ${{ steps.egress.outcome || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
