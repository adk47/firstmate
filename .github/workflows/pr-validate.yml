        # the shared fail-closed outcome predicate and every automated writer's
        # tag-before-status ordering.
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_customer_outcome \
            tests.test_resolution_writers
      - name: Run Slack botToken SecretRef reader tests
        # openclaw-main.json carries botToken as a SecretRef; scripts that
        # json.load() it must resolve it via scripts/lib/slack_token.py or they
        # send a dict as the Bearer token. Same bare stdlib unittest.
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_slack_token
      - name: Run Intercom reply-identity resolver tests
        # scripts/lib/intercom_identity.py is the single resolution point for the
        # admin id EVERY unattended Intercom writer posts under. 2026-08-31:
        # customers saw replies signed with a human's name because the id came
        # from INTERCOM_ADMIN_ID, which /etc/openclaw/main.env sets to a human.
