name: PR Validation

on:
  pull_request:
    branches: [main]

# Cancel a run superseded by a newer push to the same PR ref. Without this every push
# stacks another full run (measured 5 of 31 runs superseded, ~16 % of pool minutes). A
# cancel only fires when a newer run starts on this ref, so the current head always has a
# live run.
#
# 2026-10-27 — WHY THE CAP IS NOT HERE. Five overlapping PR validations took node-8
# (24 cores, also running the PRODUCTION openclaw gateway, openclaw-edge, longhorn and
# argocd) to run queue 68 / load 39 / 344k ctx switches/s / 10 % idle / CPU-pressure PSI
# 52 %, and the timing-sensitive watchdog suites then failed on a DIFFERENT unrelated test
# each attempt. A constant concurrency group is the WRONG instrument: GitHub has no
# host-scope, a constant group throws away the supersede-cancel above, and its single
# pending slot silently drops a third PR's run (workflow_dispatch cannot rescue that — a
# dispatch of this workflow is not a pull_request event). The cap that matches the
# resource is on the HOST, in the bats step: `scripts/bats-slot.sh` takes an exclusive
# flock so at most ONE suite runs per box, waits up to 45 minutes, and fails LOUDLY
# instead of ever running unslotted.
#
# ROLLBACK of the slot: drop the `scripts/bats-slot.sh ... --` prefix on the bats
# invocation. Do that only with a node-8 hydra runner count of 1-2, or the pile-up returns.
concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHERE EACH JOB RUNS (2026-10-27, captain: "what is the overloaded machine? can you find more
  # resources in our pool to use"). Every job here used to run on node-8's hydra runner services
  # — the host of the PRODUCTION openclaw gateways (Caroline), intercom-webhook, muso-mcp and
  # cloudflared. Five overlapping PRs took node-8 to load 39 / run queue 68 (#1403) and queued a
  # prod Deploy HYDRA 13+ min behind eight validations. Jobs that only read the repo now run on
  # `ovh-hydra`, a repo-level ARC scale set in the cluster (H-DevOps
  # https://github.com/Muso-AI/H-DevOps/pull/4516; 6 slots carved from the shared pool, never on
  # ovh-node-8). Only jobs that must touch node-8's real state stay there, and they are small:
  #   node8-handoff     writes /var/lib/hydra-qa/{rebase-integrity,blast-radius} for
  #                     qa-pr-approve.sh (Guards 8/9 read them on node-8), and runs the live
  #                     Trino Layer B through node-8's kubectl
  #   deploy-preflight  dry-runs rsync against the live /opt/hydra, reads the live cron store
  #                     and /etc/openclaw/<profile>.env
  # A pod has none of node-8's tools and runs as the non-root `runner` user:
  # scripts/ci/arc-toolchain.sh installs what each job needs (pinned to node-8's versions).
  # It also has none of node-8's SECRETS (/etc/openclaw/*.env, /etc/hydra/*.env, the gog/gh
  # logins), which is the point: a test that silently needed production credentials goes red
  # here instead of quietly using them.
  validate:
    runs-on: ovh-hydra
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh

      - name: Rebase staleness check — flag overlapping changes on main
        # Why this gate exists: GitHub's "merge" button doesn't refuse to
        # merge a PR that's behind main, even when both touch the same
        # file. The squash-merge will auto-resolve textually if the edits
        # are in different sections, and the post-merge deploy will run
        # against the squashed state — but no CI run ever validated the
        # combined state. PR #339 vs #330 (2026-05-26) is the canonical
        # case: both edited deploy.sh + CLAUDE.md in different sections,
        # the merge succeeded, the deploy was clean — but it was luck,
        # not a tested invariant.
        #
        # This step fails when the PR branch is behind main AND touches
        # at least one file that also changed on main since the branch
        # diverged. It does NOT fail just for being behind main — only
        # when behind + overlap, where rebasing is the cheapest way to
        # make CI actually validate what merge will produce.
        run: |
          set -euo pipefail
          echo "::group::Rebase staleness check"
          base_ref="${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # Fetch latest base to ensure origin/<base_ref> is current
          # (actions/checkout pinned the ref at workflow-trigger time).
          git fetch origin "$base_ref" --depth=200 --quiet

          base_tip=$(git rev-parse "origin/${base_ref}")
          merge_base=$(git merge-base "$head_sha" "$base_tip")

          if [ "$merge_base" = "$base_tip" ]; then
            echo "✓ Branch is up to date with $base_ref — no overlap check needed"
            echo "::endgroup::"
            exit 0
          fi

          behind=$(git rev-list --count "$head_sha..$base_tip")

          # Files this PR touches relative to its divergence point
          pr_files=$(git diff --name-only "${merge_base}...${head_sha}" | sort -u)
          # Files changed on main since the PR branch diverged
          base_files=$(git diff --name-only "${merge_base}..${base_tip}" | sort -u)
          # Intersection
          overlap=$(comm -12 <(echo "$pr_files") <(echo "$base_files") || true)

          if [ -z "$overlap" ]; then
            echo "Branch is $behind commit(s) behind $base_ref but touches no files"
            echo "that also changed there — no rebase needed."
            echo "(The CI run on this commit reflects pre-merge state; the merge's"
            echo "actual diff has no textual conflict possible against this PR.)"
            echo "::endgroup::"
            exit 0
          fi

          echo "::endgroup::"
          echo "::error::This PR's branch is $behind commit(s) behind $base_ref and touches files that also changed on $base_ref since the branch diverged. Rebase before merging so CI validates the actual post-merge state."
          echo
          echo "Overlapping files:"
          echo "$overlap" | sed 's/^/  /'
          echo
          echo "Why this matters:"
          echo "  Even when the squash-merge auto-resolves textually, CI never ran"
          echo "  against the combined state. If both PRs touched the same logic in"
          echo "  different sections of the same file, only a rebase + re-CI proves"
          echo "  the merged result still passes."
          echo
          echo "Fix:"
          echo "  git fetch origin $base_ref"
          echo "  git rebase origin/$base_ref"
          echo "  # resolve conflicts if any"
          echo "  git push --force-with-lease"
          exit 1

      - name: JSON Lint — validate gateway configs
        run: |
          echo "::group::Validating gateway configs"
          FAILED=0
          for cfg in openclaw-main.json openclaw-edge.json; do
            if [ -f "$cfg" ]; then
              if ! python3 -m json.tool "$cfg" > /dev/null 2>&1; then
                echo "::error::$cfg is not valid JSON"
                FAILED=1
              else
                echo "$cfg is valid JSON"
              fi
            else
              echo "::error::$cfg not found"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "::endgroup::"

      - name: openclaw MCP config lint — reject mcp-remote stdio entries
        # Shifts the mcp-remote leak-class regression gate left from
        # deploy-time (Step 1 of scripts/deploy.sh) to PR-time. Without
        # this step, a PR that commits an mcp-remote stdio entry passes
        # validation and only fails at the deploy on Node 8 — after
        # merge. See scripts/lint-openclaw-config.sh for the rule.
        run: |
          echo "::group::MCP config lint"
          chmod +x scripts/lint-openclaw-config.sh
          scripts/lint-openclaw-config.sh \
            openclaw-main.json openclaw-edge.json
          echo "::endgroup::"

      - name: company-finder argv-safety — no table snapshot through jq argv
        # Prevents re-introducing the jq E2BIG bug class that took the daily
        # company-finder cron down (2026-06-13, ledger.sh; #516 fixed the same
        # class in dedupe-candidates.sh just before): a full NocoDB table
        # snapshot passed to jq via --argjson/--arg lands on argv, capped at
        # MAX_ARG_STRLEN (128KB) → "jq: Argument list too long" (exit 126) once
        # Contacts/Company Intelligence grow past ~2k rows. The check is
        # self-maintaining (snapshot vars are derived from fetch_mapped/
        # fetch_table assignments). See scripts/company-finder/check-argv-safety.sh.
        run: |
          echo "::group::company-finder argv-safety"
          chmod +x scripts/company-finder/check-argv-safety.sh
          scripts/company-finder/check-argv-safety.sh
          echo "::endgroup::"

      - name: Gateway policy invariants — main profile
        # Pins flags that enable correct cross-agent behavior on the
        # main gateway. Without these, failures look like working
        # sessions.resolve followed by "forbidden — Agent-to-agent
        # messaging is disabled." (see PR #177). We enforce here so a
        # future config reorg / reset wizard can't silently drop them.
        run: |
          echo "::group::Gateway policy invariants"
          fail=0
          # tools.agentToAgent.enabled must be true on main. Edge is
          # intentionally left default (disabled) — only @CS (isolated)
          # binds there.
          a2a=$(jq -r '.tools.agentToAgent.enabled // false' openclaw-main.json)
          if [ "$a2a" != "true" ]; then
            echo "::error file=openclaw-main.json::tools.agentToAgent.enabled must be true on main (was: $a2a). See PR #177."
            fail=1
          else
            echo "openclaw-main.json: tools.agentToAgent.enabled=true ✓"
          fi
          # Conversely, edge must NOT enable agentToAgent — it's a
          # single-agent profile and enabling A2A would expose the
          # externally-facing @CS to the broader roster if someone
          # ever wired a cross-profile route.
          v=$(jq -r '.tools.agentToAgent.enabled // false' openclaw-edge.json)
          if [ "$v" = "true" ]; then
            echo "::error file=openclaw-edge.json::tools.agentToAgent.enabled must NOT be true on edge profile (single-agent by design). See PR #177."
            fail=1
          else
            echo "openclaw-edge.json: agentToAgent disabled ✓"
          fi
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "::endgroup::"

      - name: Edge support agent tool lockdown — policy↔runtime sync
        # Caroline (the `support` agent) is the ONLY customer-facing agent and
        # ingests untrusted Intercom text. policies/tool-deny-lists.yaml DECLARES
        # her denials ("MOST RESTRICTED"), but that file is never translated into
        # the openclaw runtime — only agents.list[].tools.deny in openclaw-edge.json
        # actually constrains the live gateway (issue #408). Without enforcement a
        # prompt-injection could shell out via `exec` to muso-admin-api.sh and
        # self-approve a tier-2 merge/unmerge. This gate couples the two files:
        # every policy-declared support denial that maps to a REAL openclaw tool
        # must be enforced in the edge runtime config, so the prose can never again
        # drift from what the gateway enforces.
        run: |
          echo "::group::Edge support tool lockdown"
          fail=0

          # Bridge the policy file's conceptual taxonomy (exec, kubectl, db_read…)
          # to openclaw's ACTUAL tool identifiers. Only listed names are runtime-
          # enforceable; grow this set as more policy categories gain a real
          # openclaw tool id. `exec` is the #408 capability with a path to
          # privileged admin writes.
          REAL_OPENCLAW_TOOLS="exec"

          # Is a tool effectively DENIED for support on edge? Denied if it is in
          # tools.deny, OR (should the agent ever switch to an allowlist) absent
          # from tools.allow. Handles either mechanism.
          is_denied() {
            jq -r --arg t "$1" '
              (.agents.list[] | select(.id=="support")) as $s
              | (($s.tools.deny  // []) | index($t)) as $d
              | ($s.tools.allow // null) as $a
              | if $d != null then "yes"
                elif ($a != null and ($a | index($t)) == null) then "yes"
                else "no" end
            ' openclaw-edge.json
          }

          # 1. Hard guarantee (#408): support must deny exec on edge.
          if [ "$(is_denied exec)" != "yes" ]; then
            echo "::error file=openclaw-edge.json::support agent must deny 'exec' on edge (issue #408) — it is customer-facing with a path to privileged admin writes. Add agents.list[support].tools.deny:[\"exec\"]."
            fail=1
          else
            echo "openclaw-edge.json: support denies exec ✓"
          fi

          # 2. Policy↔runtime sync: every support.denied entry from the policy file
          #    that maps to a real openclaw tool must be enforced in the runtime.
          declared=$(awk '
            /^  support:/ {inblk=1; next}
            inblk && /^  [A-Za-z]/ {inblk=0}
            inblk && /^      - / {sub(/^      - /,""); print}
          ' policies/tool-deny-lists.yaml)
          for t in $REAL_OPENCLAW_TOOLS; do
            if printf '%s\n' "$declared" | grep -qx "$t"; then
              if [ "$(is_denied "$t")" != "yes" ]; then
                echo "::error file=openclaw-edge.json::policies/tool-deny-lists.yaml declares support denies '$t', but openclaw-edge.json does not enforce it. Add it to agents.list[support].tools.deny."
                fail=1
              else
                echo "policy↔runtime: support '$t' declared denied AND enforced ✓"
              fi
            fi
          done

          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "::endgroup::"

      - name: Shared config drift check
        run: |
          echo "::group::Checking shared config drift"
          if [ -f scripts/validate-shared-config.sh ]; then
            chmod +x scripts/validate-shared-config.sh
            ./scripts/validate-shared-config.sh
          else
            echo "validate-shared-config.sh not found — skipping"
          fi
          echo "::endgroup::"

      - name: OpenRouter model ref resolvability
        # Validates every "openrouter/X" model ref in configs against
        # GET /v1/models/:id/endpoints — catches "syntactically fine but
        # provider-unroutable" model IDs that validate-shared-config.sh +
        # validate-config-matrix.sh both miss (PR #351 review lesson).
        # Skips with a non-fatal WARN when OPENROUTER_API_KEY isn't set
        # in CI secrets — wire the secret to activate enforcement.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "::group::OpenRouter model ref resolvability"
          if [ -f scripts/validate-openrouter-models.sh ]; then
            chmod +x scripts/validate-openrouter-models.sh
            ./scripts/validate-openrouter-models.sh
          else
            echo "validate-openrouter-models.sh not found — skipping"
          fi
          echo "::endgroup::"

      - name: Workload-driven matrix invariants
        # Pins the agent × model × thinking matrix established in PR
        # #220 against silent regression. Encodes:
        #   - Every agent has thinkingDefault, never "off"; defaults
        #     block has thinkingDefault set (2026-04-28 incident class)
        #   - Claude 4.x models declare reasoning:true to match
        #     upstream pi-ai catalog (otherwise default-thinking
        #     resolver returns "off" and re-creates the 04-28 shape)
        #   - Cron payload thinking values inside the schema enum
        # Without this gate, a future PR or `openclaw mcp set` write
        # could silently revert the matrix and the regression would
        # only surface in production.
        run: |
          echo "::group::Workload-driven matrix invariants"
          chmod +x scripts/validate-config-matrix.sh
          scripts/validate-config-matrix.sh
          echo "::endgroup::"

      - name: SOUL.md check — all workspaces
        run: |
          echo "::group::Checking SOUL.md in all workspaces"
          # Core workspaces that must always exist
          EXPECTED_WORKSPACES="ceo cmo coordinator cto scout devops finance operations qa support"
          MISSING=""
          for ws in $EXPECTED_WORKSPACES; do
            if [ ! -f "workspaces/${ws}/SOUL.md" ]; then
              MISSING="${MISSING} ${ws}"
              echo "::error::Missing SOUL.md in workspaces/${ws}/"
            else
              echo "Found SOUL.md in workspaces/${ws}/"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing SOUL.md in workspaces:${MISSING}"
            exit 1
          fi
          echo "All workspaces have SOUL.md"
          echo "::endgroup::"

      - name: Tool deny list audit — denials can only grow
        run: |
          echo "::group::Auditing tool deny lists"
          DENY_FILE="policies/tool-deny-lists.yaml"

          # Get the deny list from the main branch
          git show origin/main:${DENY_FILE} > /tmp/deny-list-main.yaml 2>/dev/null || {
            echo "No deny list on main branch yet — skipping comparison"
            exit 0
          }

          # Extract all denied tool entries from main (baseline)
          grep -E '^\s+-\s+' /tmp/deny-list-main.yaml | sed 's/^[[:space:]]*-[[:space:]]*//' | sort -u > /tmp/denials-main.txt

          # Extract all denied tool entries from PR branch
          grep -E '^\s+-\s+' ${DENY_FILE} | sed 's/^[[:space:]]*-[[:space:]]*//' | sort -u > /tmp/denials-pr.txt

          # Find any denials that were REMOVED (present in main but not in PR)
          REMOVED=$(comm -23 /tmp/denials-main.txt /tmp/denials-pr.txt)

          if [ -n "$REMOVED" ]; then
            echo "::error::Tool denials were REMOVED. Denials can only grow, never shrink."
            echo "The following denials were removed:"
            echo "$REMOVED"
            echo ""
            echo "This prevents agents from expanding their own permissions."
            echo "If this removal is intentional, Aaron must approve it directly."
            exit 1
          fi

          # Show what was added (informational)
          ADDED=$(comm -13 /tmp/denials-main.txt /tmp/denials-pr.txt)
          if [ -n "$ADDED" ]; then
            echo "New denials added (OK):"
            echo "$ADDED"
          else
            echo "No changes to deny lists"
          fi
          echo "::endgroup::"

      - name: CODEOWNERS check — only Aaron can modify
        run: |
          echo "::group::Checking CODEOWNERS integrity"
          # Check if CODEOWNERS was modified in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          if echo "$CHANGED_FILES" | grep -qE '(^|/)CODEOWNERS$'; then
            # Check if the PR author is Aaron
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"
            if [ "$PR_AUTHOR" != "adk47" ]; then
              echo "::error::CODEOWNERS was modified by ${PR_AUTHOR}. Only Aaron (adk47) can modify CODEOWNERS."
              exit 1
            fi
            echo "CODEOWNERS modified by adk47 — allowed"
          else
            echo "CODEOWNERS not modified — OK"
          fi
          echo "::endgroup::"

      - name: CS agent reference file security scan
        run: |
          echo "::group::Scanning CS reference files for internal term leaks"
          LEAKED=0

          # Blocklist of internal terms that must NEVER appear in customer-facing
          # reference files. Matched with WORD BOUNDARIES (\b...\b) so substrings
          # inside legitimate English words do not false-positive. Prior version
          # used substring matching and tripped on "weeks" (contains "EKS"),
          # "block" (contains "BLoC"), "archive" (contains "Hive").
          #
          # SOURCED, not duplicated. scripts/sync-platform-llms.sh enforces the
          # same list on the cron path, over a generated file that is
          # rsync-excluded and therefore invisible to this step. Two inline
          # copies would drift, and the drift would be silent on exactly the
          # path with no human review.
          # The SCAN is shared too, not just the pattern: the helper reports a
          # grep error (exit >= 2, e.g. a malformed term) as a hit, where a bare
          # `grep || true` here would swallow it and print "CLEAN:" for every
          # file.
          . scripts/lib/cs-reference-blocklist.sh

          if [ -d "workspaces/support/reference" ]; then
            for f in workspaces/support/reference/*.md; do
              [ -f "$f" ] || continue
              MATCHES=$(cs_reference_blocklist_hits "$f" || true)
              if [ -n "$MATCHES" ]; then
                echo "::error::LEAKED INTERNAL TERMS in $f:"
                echo "$MATCHES"
                LEAKED=1
              else
                echo "  CLEAN: $f"
              fi
            done
          else
            echo "No reference directory found — skipping"
          fi

          if [ "$LEAKED" -eq 1 ]; then
            echo "::error::CS reference files contain internal terms. These files are customer-facing — strip all internal references."
            exit 1
          fi
          echo "CS reference files are clean"
          echo "::endgroup::"

      - name: Caroline personalization — enrichment never touches openclaw memory
        run: |
          echo "::group::Asserting personalization enrichment is memory-free"
          # Customer-isolation invariant (docs/superpowers/specs/2026-05-14-caroline-rag-design.md):
          # Caroline's cross-conversation memory is deliberately pinned OFF. The
          # personalization enrichment path must source data live from systems-of-
          # record ONLY and live in per-conversation session state — NEVER in
          # openclaw memory/recall/capture, which has open PII + cross-customer
          # leak bugs (#63921, #65374). This guard fails if the enrichment source
          # files ever reference a memory-persistence primitive.
          FORBIDDEN='MEMORY\.md|autoCapture|autoRecall|memory-lancedb|active-memory|dreaming|memorySearch|memory_capture|memory_write'
          FILES="plugins/intercom/src/enrichment.ts plugins/intercom/src/muso-snapshot-client.ts"
          BAD=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            HITS=$(grep -nE "$FORBIDDEN" "$f" || true)
            if [ -n "$HITS" ]; then
              echo "::error::$f references an openclaw memory primitive — enrichment must never persist to memory:"
              echo "$HITS"
              BAD=1
            else
              echo "  CLEAN: $f"
            fi
          done
          if [ "$BAD" -eq 1 ]; then
            echo "::error::Personalization enrichment must not use openclaw memory. Keep data in per-conversation session state."
            exit 1
          fi
          echo "Personalization enrichment is memory-free"

          # Snapshot client path allowlist pin: the edge enrichment client may
          # only reach the claiming/team/profile admin endpoints (GET-only).
          # Any new "/api/v3/admin/..." literal outside that set (or any
          # non-admin absolute API path) must show up as a diff of THIS line —
          # the reach of the customer-facing agent's credential can only grow
          # visibly. (Login path /admin/user/login is the auth call itself.)
          SNAP=plugins/intercom/src/muso-snapshot-client.ts
          if [ -f "$SNAP" ]; then
            # Require at least one path segment after admin/ so the bare
            # "/api/v3/admin/" prefix-guard string inside assertAllowed()
            # doesn't false-positive. Extraction stops at "?" and "(" (not in
            # the char class), so the template-literal profile routes extract
            # as ".../profile/${encodeURIComponent" — the allowlist below is
            # anchored ($) to those exact extracted forms, NOT prefixes, so a
            # reintroduced /api/v3/admin/profile/search cannot sneak past.
            ALLOWED=':/api/v3/admin/(claiming|team|user/login|profile/[$][{]encodeURIComponent)$'
            # Self-test: the fuzzy-search endpoint this pin exists to keep out
            # must always be flagged as stray by the allowlist.
            if ! printf '%s\n' '0:/api/v3/admin/profile/search' | grep -qvE "$ALLOWED"; then
              echo "::error::endpoint-pin self-test failed: profile/search would pass the allowlist"
              exit 1
            fi
            STRAY=$(grep -noE '/api/v3/admin/[a-zA-Z0-9][a-zA-Z0-9/_${}.-]*' "$SNAP" \
              | grep -vE "$ALLOWED" || true)
            if [ -n "$STRAY" ]; then
              echo "::error::$SNAP reaches an admin endpoint outside the pinned set (claiming|team|profile/\${id}[/credits]|user/login):"
              echo "$STRAY"
              exit 1
            fi
            echo "Snapshot client endpoint reach is pinned to claiming|team|profile/\${id}[/credits]"
          fi
          echo "::endgroup::"

      - name: AI code review
        id: ai-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "::group::AI Code Review"

          # Skip if no API key configured
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping AI review"
            echo "::endgroup::"
            exit 0
          fi

          # Get the diff against main
          DIFF=$(git diff origin/main...HEAD -- . ':!*.lock' ':!node_modules' 2>/dev/null | head -4000)

          if [ -z "$DIFF" ]; then
            echo "No diff to review"
            echo "::endgroup::"
            exit 0
          fi

          REVIEW=$(python3 -c "
          import json, urllib.request, os, sys

          diff = sys.stdin.read()
          if not diff.strip():
              print('PASS: No changes to review')
              sys.exit(0)

          prompt = '''Review this diff to the HYDRA multi-agent system repository. This manages AI agents deployed on a production Kubernetes cluster.

          Flag ONLY critical issues in these categories:
          1. **SECURITY**: Leaked credentials, internal IPs, employee names, or infrastructure details in customer-facing files (workspaces/support/reference/*)
          2. **AGENT SAFETY**: Weakened tool deny lists, removed security rules from SOUL.md, expanded egress allowlists, sessions_send enabled for external agents
          3. **PROMPT INJECTION RISK**: SOUL.md changes that could make agents more susceptible to injection (removed canary detection, weakened scope enforcement)
          4. **COST RISK**: Model tier changes (Haiku→Sonnet/Opus upgrades without justification), removed rate limits, unbounded token/turn limits
          5. **BREAKING CHANGES**: Renamed tools, changed skill triggers, modified approval tiers without documentation

          Context: The support (CS) agent is the ONLY external-facing agent. It faces untrusted users. Any changes to its workspace require extra scrutiny.

          If no critical issues found, respond with exactly: PASS
          If issues found, respond with: FAIL followed by a brief list.
          Keep response under 500 words.

          Diff:
          ''' + diff[:8000]

          data = json.dumps({
              'model': 'claude-opus-4-6',
              'max_tokens': 1024,
              'messages': [{'role': 'user', 'content': prompt}]
          }).encode()

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=data,
              headers={
                  'Content-Type': 'application/json',
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01'
              }
          )
          try:
              resp = urllib.request.urlopen(req, timeout=60)
              result = json.loads(resp.read())
              text = result['content'][0]['text']
              print(text[:2000])
          except Exception as e:
              print(f'PASS (AI review unavailable: {e})')
          " <<< "$DIFF")

          echo "$REVIEW"

          if echo "$REVIEW" | head -1 | grep -q "^FAIL"; then
            echo "::warning::AI review flagged issues — review required"
          fi

          echo "::endgroup::"

      - name: No new literal /tmp scratch paths (MUS-5643)
        # Agent Bash calls are separate shells, so `trap ... EXIT` never cleaned
        # /tmp (536 pr-review-*.json, 1171 review clones). Scope is the ADDED
        # lines of skills-all/**, workspaces/*/AGENTS.md and scripts/** vs base
        # (scripts/check-no-tmp-scratch.sh SCOPE); legacy sites do not trip it.
        run: |
          echo "::group::No new /tmp scratch paths"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=200 --quiet
          scripts/check-no-tmp-scratch.sh --base "origin/${{ github.event.pull_request.base.ref }}"
          echo "::endgroup::"

      - name: Skill drift check — skills-all/ vs workspaces/*/skills/
        # Per memory `feedback_skill_dual_tree.md` and incident 2026-04-29
        # postmortem: skill fixes have repeatedly landed in skills-all/ but
        # not in some workspaces/<agent>/skills/ copies (PRs #183, #187,
        # #213). This check fails the PR if any SKILL.md drifts from its
        # canonical version, unless the drift is allow-listed in
        # .skill-drift-allowlist.txt with a reason. New drift introduced
        # in this PR will block merge until reconciled or explicitly
        # allow-listed (with a follow-up tracker).
        run: |
          echo "::group::Skill drift check"
          chmod +x scripts/check-skill-drift.sh
          scripts/check-skill-drift.sh
          echo "::endgroup::"

      - name: Caroline inventory drift — the Jev question set matches the tools and skills
        # plugins/intercom/src/caroline-{inventory,questions}.json are GENERATED from the
        # registered support tools, Caroline's skills and the action router's intents. They are
        # what the pre-turn classifier is told Caroline can do, so a tool or skill added without
        # regenerating them means the router keeps routing against yesterday's capabilities and
        # never names the new one. This fails the PR on drift; fix with
        # scripts/gen-caroline-inventory.sh and commit the result.
        run: |
          echo "::group::Caroline inventory drift check"
          chmod +x scripts/check-caroline-inventory.sh scripts/gen-caroline-inventory.sh
          scripts/check-caroline-inventory.sh
          echo "::endgroup::"

      - name: Em-dash lint — no em-dashes in Caroline's surface
        # The outbound sanitizer (sanitize-typography.ts) guarantees no em-dash
        # reaches a customer at runtime; this gate keeps the SOURCE clean so the
        # model never sees an em-dash in its own SOUL / KB / skills and learns to
        # mimic it. Prose != enforcement, so this is the mechanical backstop for
        # the knowledge base, paired with the runtime sanitizer for replies.
        run: |
          echo "::group::Em-dash lint"
          bash scripts/lint-no-em-dash.sh
          echo "::endgroup::"

      - name: Bootstrap-size check — Caroline's injected files must fit the cap
        # A bootstrap file over bootstrapMaxChars has its MIDDLE removed in the
        # injected context on every turn: openclaw keeps a 75% head and a 25%
        # tail (trimBootstrapContent, BOOTSTRAP_HEAD_RATIO/TAIL_RATIO). Both
        # SOUL.md (~44k) and TOOLS.md (46k, 310 warnings in 24h on 2026-07-28)
        # have breached. NOTE: an earlier version of this comment said the TAIL
        # was truncated and pointed at the trailing Honesty/SLA rules -- wrong;
        # the tail survives. This gate covers every injected file plus the total.
        run: |
          echo "::group::Bootstrap-size check"
          bash scripts/check-soul-bootstrap-size.sh
          echo "::endgroup::"

      - name: Refund-denial honesty doctrine check — @Ops must not invent an Aaron-override
        # The operations agent once fabricated "holding for Aaron approval" when
        # pushed to refund a customer with prior refunds. The doctrine now scripts a
        # no-override pushback response and a verifiable definition of "escalated".
        # Prose != enforcement, so this gate fails if those anchors are removed.
        run: |
          echo "::group::Refund-denial honesty doctrine check"
          bash scripts/check-refund-doctrine.sh
          echo "::endgroup::"

      - name: Caroline claims/credits/merges doctrine eval (10 most common questions)
        # The 2026-10-26 merge audit found 27/30 merge asks promised "within 5 business
        # days" (0 merge tickets closed in 7 d) and claimed users told their claims need
        # review. The reference files and the create_ticket SLA taught it; this gate keeps
        # the corrected answers (and sla: null for these kinds) from regressing.
        run: |
          echo "::group::Caroline claims/credits/merges doctrine eval"
          bash scripts/check-caroline-claims-doctrine.sh
          echo "::endgroup::"

      - name: "Ops-skill safety-clause doctrine check (#1047 silent-deletion regression class)"
        # PR #1047 silently deleted 7 safety clauses from the customer-data-resolution
        # and subscription-refund-reconciliation @Ops skills and every CI gate stayed
        # green. MUS-1796 (#1050) restored the prose; this gate anchors it so the next
        # silent deletion fails CI instead of shipping unnoticed.
        run: |
          echo "::group::Ops-skill safety-clause doctrine check"
          bash scripts/check-ops-skill-doctrine.sh
          echo "::endgroup::"

      - name: Collaborator derived-table doctrine check — no hand-written SQL on a rebuilt table
        # Incident 2026-07-29: asked to remove ~24 named collaborators from a profile,
        # @Ops proposed a 32-row direct production DELETE against
        # catalog_profile_collaboration and escalated it for approval. That table is
        # DERIVED from track co-credits — every rebuild recomputes it and deletes
        # anything not currently backed, so hand-writes are silently reverted. A rebuild
        # of that same profile reported rowsDeleted: 0 (all 32 rows were live and
        # credit-backed). Prose != enforcement, so this gate fails if the
        # muso-ops-collaborators anchors are removed OR if any skill doc starts handing
        # agents write-SQL against the collaboration/aggregation serving tables.
        run: |
          echo "::group::Collaborator derived-table doctrine check"
          bash scripts/check-collaborator-doctrine.sh
          echo "::endgroup::"

      - name: Admin-API bulk-destructive gate parity check — canonical vs workspace muso-admin-api.sh
        # muso-ops-admin is a REGISTERED workspace divergence with TWO live copies of
        # the bulk-destructive DELETE gate (skills-all/ and workspaces/operations/).
        # check-skill-drift.sh only walks SKILL.md, so these two shell scripts are
        # otherwise completely ungated and could silently diverge on the exact safety
        # logic deciding whether a bulk-destructive DELETE run is allowed. This gate
        # compares the five safety-critical functions PLUS three regions outside
        # them — the threshold/window constants, the complete `if ! ...; then ... fi`
        # around the cmd_call invocation, and the approval-evidence parser arms —
        # and fails if the LOGIC drifts between copies. Comment and heredoc PROSE is
        # normalized out (the copies word those differently on purpose); heredoc
        # lines carrying shell expansions are NOT, since they are executable.
        run: |
          echo "::group::Admin-API bulk-destructive gate parity check"
          bash scripts/check-admin-api-gate-parity.sh
          echo "::endgroup::"

      - name: Agent-bridge doctrine check — CS/ops REQUEST, they never fix the data lane
        # 2026-08-26: the CS/ops agents were attempting data-layer fixes without lane
        # knowledge. A "0 plays / flat graph" cluster looked like a capture gap and was a
        # frozen serving generation (platform-data-processing-v4#222) — a capture-side fix
        # would have found nothing. A "credits missing" cluster looked like a bad flag and
        # was an AUTHORIZED deletion 13-19 days older than it (industry-data-processing#1539)
        # — "restoring" those credits would have reversed a deliberate human action.
        # scripts/agent-bridge-request.sh is the runtime gate; this checks the doctrine
        # anchors around it (ops SOUL, Caroline SOUL, skill, wrapper, notifier, registration).
        run: |
          echo "::group::Agent-bridge doctrine check"
          bash scripts/check-agent-bridge-doctrine.sh
          echo "::endgroup::"

      - name: Gateway profile-parity check — every openclaw-<profile>.json is in every enumerated deploy/ops list
        # MUS-2654 splits agents onto their own gateways. A profile missing from any one list
        # (deploy.sh parser/loops, aux units, watchdog, config matrix, peer labels, deploy.yml)
        # is silent. Enumeration parity only: deploy.sh's per-profile branches are not checked.
        run: |
          echo "::group::Gateway profile-parity check"
          bash scripts/check-gateway-profile-parity.sh
          echo "::endgroup::"

      - name: Intercom reply-identity doctrine check — agents post as Caroline, never as a human
        # 2026-08-31: customers saw escalation follow-ups signed "Nicholas Sollazzo"
        # mid-thread. Caroline's own replies were correct (the plugin uses
        # account.botAdminId); the ops agent composed a raw admin-API call and took Nick's
        # admin id from the table in docs/lessons/muso-domain.md — a table written for
        # READING conversations, which reads as a menu of posting identities if nothing
        # says otherwise. A human's Slack authorization authorizes the WRITE, never the
        # posting IDENTITY. Prose != enforcement, so this gate fails if the doctrine
        # anchors are removed OR if an agent-callable script hardcodes a human admin id
        # on an Intercom write.
        run: |
          echo "::group::Intercom reply-identity doctrine check"
          bash scripts/check-intercom-reply-identity.sh
          echo "::endgroup::"

      - name: Intercom ops-write doctrine check — writes go through the wrapper, note by default
        # 2026-09-01: the ops agent resolved an escalated conversation by composing a raw
        # curl POST /conversations/<id>/reply from memory. It chose "note" (internal,
        # correct); on 2026-08-31 the same hand-typed path chose "comment" self-approved as
        # god_mode and customers saw a human's name mid-thread. Whether the customer reads
        # the text was one word in a payload the agent typed itself. The runtime gate is
        # scripts/intercom-ops-write.sh; this checks the doctrine anchors around it (ops
        # SOUL, muso-intercom skill, wrapper pins, registration) and that no agent-copied
        # doc carries a raw write recipe.
        run: |
          echo "::group::Intercom ops-write doctrine check"
          bash scripts/check-intercom-ops-write-doctrine.sh
          echo "::endgroup::"

      - name: God-mode allowlist must be workspace-only — never in the canonical skill
        # Since 2026-08-26 the god-mode self-approve branch of the bulk-destructive
        # gate ships in BOTH copies of muso-admin-api.sh, because the parity gate
        # above requires their safety logic to be identical. That makes the ABSENCE
        # of tier2-godmode-allowlist.txt from skills-all/muso-ops-admin/config/ the
        # only thing stopping ceo/cmo/cto/caroline from self-approving mass
        # deletions — deploy.sh rsyncs skills-all/*/config/ to every agent. Before
        # the port that protection was implicit (canonical had no god-mode code, so
        # the file was inert); it is not inert now, so it gets a gate.
        run: |
          echo "::group::God-mode allowlist placement check"
          bash scripts/check-no-canonical-godmode-allowlist.sh
          echo "::endgroup::"

      - name: Attachment-status honesty doctrine check — absence of the block proves nothing
        # PR #843, rounds 3-7: every round found another path that dropped or truncated
        # a customer attachment without minting an [ATTACHMENT_STATUS] record, while the
        # contract told Caroline that the ABSENCE of that block proved every attachment
        # arrived. That promise is unbounded — it holds only if every current AND future
        # drop path reports perfectly — so eight fixed paths later it was still false.
        # The promise was withdrawn instead: the block is a positive claim about the
        # items it LISTS, its absence proves nothing, and a file Caroline cannot account
        # for is one she ASKS about rather than declaring delivered or failed. Prose !=
        # enforcement, so this gate fails if the honest wording is dropped from any of
        # the four surfaces that carry it, or if the old promise is re-added to any.
        run: |
          echo "::group::Attachment-status honesty doctrine check"
          bash scripts/check-attachment-status-doctrine.sh
          echo "::endgroup::"

      - name: Data-sourcing doctrine check — Caroline must answer "via data partnerships"
        # Aaron's directive (2026-07-17): asked how Muso gets its data, Caroline
        # answers strictly "via data partnerships" — never naming a source or how
        # it's collected. The rule lives in support/SOUL.md; prose != enforcement,
        # so this gate fails if its load-bearing anchors are silently removed.
        run: |
          echo "::group::Data-sourcing doctrine check"
          bash scripts/check-data-sourcing-doctrine.sh
          echo "::endgroup::"

      - name: Analytics entitlement doctrine check — Caroline states no figures unless analytics.entitled is true
        # Caroline disclosed a customer's lifetime stream figures to a non-subscriber
        # on 2026-09-30. The rule lives in support/SOUL.md (entitlement is decided by
        # profile_analytics_status, which returns analytics.entitled); prose != enforcement,
        # so this gate fails if its load-bearing anchors are silently removed.
        run: |
          echo "::group::Analytics entitlement doctrine check"
          bash scripts/check-analytics-entitlement-doctrine.sh
          echo "::endgroup::"

      - name: Admin-API doc contract check — analytics-sources payload must document {"link"}
        # Incident 2026-07-15: @Ops sent 16x {"url": ...} to
        # POST /admin/track/<id>/analytics-sources and got 16x HTTP 400, because
        # the skill documented the stale field. PR #696 corrected it to
        # {"link": ...}; prose != enforcement, so this gate fails if the dead
        # field reappears in any skill doc or the corrected example is removed.
        run: |
          echo "::group::Admin-API doc contract check"
          bash scripts/check-admin-api-doc-contract.sh
          echo "::endgroup::"

      - name: Dead-infra reference check — no agent may be pointed at Athena/AWS/dead-v3
        # Finance escalation 2026-07-24: the daily-dispute-handler cron followed
        # muso-stripe-disputes into a live "query Athena" section and died on
        # AssumeRole InvalidClientTokenId. AWS was decommissioned 2026-05-31,
        # Athena retired 2026-04-25, profile_v3_* tables are frozen. Prose !=
        # enforcement, so this gate fails if any agent-facing surface points at
        # them; historical/migration content is exempted (with reasons) via
        # .dead-infra-allowlist.txt, whose entries go stale-red when reconciled.
        run: |
          echo "::group::Dead-infra reference check"
          bash scripts/check-dead-infra-refs.sh
          echo "::endgroup::"

      - name: Egress allowlist check — no unauthorized additions
        run: |
          echo "::group::Checking egress allowlist changes"
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Check if any egress-related files were modified
          EGRESS_CHANGES=$(echo "$CHANGED_FILES" | grep -i 'egress' || true)

          if [ -n "$EGRESS_CHANGES" ]; then
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"
            if [ "$PR_AUTHOR" != "adk47" ]; then
              echo "::error::Egress allowlist changes detected by ${PR_AUTHOR}. Only Aaron (adk47) can approve egress rule changes."
              echo "Modified files:"
              echo "$EGRESS_CHANGES"
              echo ""
              echo "Please request Aaron's review before merging."
              # Don't fail — just require review. The branch protection rule
              # should require adk47 approval for these paths.
              exit 1
            fi
            echo "Egress changes by adk47 — allowed"
          else
            echo "No egress allowlist changes — OK"
          fi
          echo "::endgroup::"

  node8-handoff:
    name: Node-8 hand-off (QA rebase-integrity + blast-radius, live Trino SQL, host-only bats)
    # The node-8 HALF of what used to be one `validate` job (2026-10-27). These three steps need
    # node-8 itself, so they cannot move to ovh-hydra with the rest:
    #   - rebase-integrity and blast-radius hand their reports to the QA reviewer through
    #     node-8's filesystem (/var/lib/hydra-qa), which qa-pr-approve.sh re-reads on node-8
    #     (Guards 8 and 9). A pod's filesystem dies with the pod.
    #   - the Trino SQL Layer B compiles statements against the live cluster through node-8's
    #     kubectl.
    #   - the few bats cases tagged `host-systemd` drive the REAL systemd-run (they test
    #     systemd's EnvironmentFile parsing); a runner pod has no systemd. Found by running
    #     the whole corpus in the ovh-ubuntu image as `runner` before the switch: 7,753 cases,
    #     and these 5 (scripts/tests/muso-env-preflight.bats) were the only ones that needed
    #     node-8. They are excluded from the ARC shards by the same tag.
    # It is deliberately NOT folded into deploy-preflight: policies/qa-approval-policy.json
    # exempts every check whose name STARTS WITH "Deploy pre-flight" from Guard 6, so the
    # Trino gate would silently become advisory there. This name is not exempted.
    # Cost on node-8: git + python3, no test suite — seconds, not the 8-process bats run.
    runs-on: [self-hosted, hydra]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh

      - name: Rebase integrity check (advisory — warns, never blocks)
        # Companion to the staleness gate above: that gate forces a rebase when
        # a PR is behind main AND overlaps files; THIS step inspects what a
        # rebase actually PRODUCED — files reverted to pre-merge-base blobs,
        # recently-merged lines erased or reintroduced, commits dropped across
        # a force-push, duplicated patches. Signals surface as ::warning:: +
        # step summary + a state file under /var/lib/hydra-qa/rebase-integrity
        # that the QA auto-review (skill Step 3d) reads and qa-pr-approve.sh
        # Guard 8 re-derives from. Advisory by design: the exit is swallowed so
        # neither a signal nor an analyzer error can hard-fail CI — Guard 8 is
        # the fail-closed consumer (WARN holds auto-approval until the REBASE
        # WARNING thread is resolved — by the reviewing skill itself, once it
        # has verified the deletions were intended and written that reasoning
        # into the thread, per SKILL.md Step 3d.3, or by a human; ERROR — and,
        # for hydra, a missing report — holds it outright).
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "::group::Rebase integrity check"
          chmod +x scripts/check-rebase-integrity.sh
          scripts/check-rebase-integrity.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            || echo "::warning::rebase-integrity analyzer errored (exit $?) — rebase state UNVERIFIED for this head; QA auto-approval is held (Guard 8)"
          echo "::endgroup::"

      - name: Blast radius check (advisory — warns, never blocks)
        # Answers the question diff size cannot: if this change is wrong, what
        # breaks? The reviewing agent has NO clone (its workspace is not a git
        # repo), so it cannot grep for the callers of a changed script — this
        # runner can, and hands the result over through the filesystem, the same
        # way the rebase-integrity step above does. The QA skill (Step 3e) reads
        # the report to scale review depth; Guard 9 in qa-pr-approve.sh consumes
        # it only when QA_BLAST_RADIUS_GATE=1, which is NOT yet the default.
        # Advisory by design: the exit is swallowed so neither a signal nor an
        # analyzer error can hard-fail CI.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "::group::Blast radius check"
          chmod +x scripts/check-blast-radius.sh
          scripts/check-blast-radius.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            || echo "::warning::blast-radius analyzer errored (exit $?) — impact UNVERIFIED for this head; the review proceeds on the 8 lenses alone"
          echo "::endgroup::"

      - name: Trino SQL staleness check — no stale SQL ships in skills-all/
        # A sweep (behind PR #794) found 99 of 169 SQL statements in
        # skills-all/ no longer compile against live Trino (schema drift:
        # dropped/retyped columns, changed UNNEST alias arity, dead
        # catalogs/tables) — five ops escalations trace back to this. Layer
        # A is an offline grep for the historically top-recurring dead
        # references (awsdatacatalog., raw_ids, profile_permissions,
        # profile_v3_(lifetime|tracks)). Layer B compiles every extracted
        # statement with a real `EXPLAIN (TYPE VALIDATE)` against the live
        # cluster (self-hosted runners reach Trino via kubectl) and
        # ratchets against .trino-sql-baseline.txt so pre-existing debt
        # doesn't instantly redden every PR — only new regressions do.
        # Scoped to files changed vs origin/main by default.
        run: |
          echo "::group::Trino SQL staleness check"
          bash scripts/check-trino-sql.sh
          echo "::endgroup::"

      - name: Host-only bats cases (tag host-systemd — need a real systemd PID 1)
        run: |
          set -euo pipefail
          # Same discovery roots as the bats-tests job, but only the files that carry the tag.
          files=$(grep -rlE '^# bats test_tags=.*\bhost-systemd\b' scripts skills-all workspaces \
                    --include='*.bats' | sort || true)
          want=$(grep -rhcE '^# bats test_tags=.*\bhost-systemd\b' $files /dev/null \
                   | awk '{s+=$1} END {print s+0}')
          if [ -z "$files" ] || [ "$want" -eq 0 ]; then
            echo "::error::no host-systemd bats cases found — the tag moved or the files did; the ARC shards exclude this tag, so nothing would run them"
            exit 1
          fi
          echo "Running $want host-systemd case(s) from:"; echo "$files" | sed 's/^/  /'
          out=$(mktemp); trap 'rm -f "$out"' EXIT
          # shellcheck disable=SC2086
          bats --filter-tags host-systemd $files | tee "$out"
          ran=$(grep -cE '^(ok|not ok) ' "$out" || true)
          if [ "$ran" -ne "$want" ]; then
            echo "::error::bats ran $ran host-systemd case(s), expected $want"
            exit 1
          fi

  deploy-preflight:
    name: Deploy pre-flight (rsync --delete dry-run vs /opt/hydra/)
    # Must run on the self-hosted hydra runner because it needs to see
    # /opt/hydra/ — the actual target of the production deploy rsync.
    # ubuntu-latest can't do this check.
    runs-on: [self-hosted, hydra]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          # Full history so the skill-drift gate can resolve the node-8
          # baseline blob (git show <.deployed-sha>:<path>); that baseline
          # can lag this PR by many commits.
          fetch-depth: 0
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh

      - name: skills-all config include pairs (same guard the deploy runs)
        # THE SHIFT-LEFT THIS JOB ALREADY CLAIMED TO BE. The deploy carries a guard that
        # every skills-all/<skill>/config/ has an rsync include pair before the unanchored
        # --exclude='config/' — without it the config silently never reaches the server.
        # That guard was only ever run at DEPLOY time, so on 2026-08-28 #874 merged a
        # config dir with no pair and every deploy on main failed until it was added:
        # the check was right, it just fired after merge, which is the one moment when
        # acting on it costs a broken fleet deploy instead of a red check.
        #
        # Same script the deploy calls, not a copy of it.
        run: |
          echo "::group::skills-all config include pairs"
          chmod +x scripts/lib/check-skills-config-includes.sh
          ./scripts/lib/check-skills-config-includes.sh . scripts/deploy.sh
          echo "::endgroup::"

      - name: Rsync dry-run against /opt/hydra/
        # This is a "shift-left" copy of scripts/deploy.sh Step 4a. The
        # deploy's pre-flight check catches server-state-would-be-wiped
        # situations, but by then the PR is already merged. Running the
        # same check at PR validation time surfaces the problem before
        # merge — so either (a) the PR author adds excludes, (b) pulls
        # the server-only state into the repo, or (c) the server state
        # is cleaned up — all BEFORE the deploy is triggered.
        #
        # Added after PR #68's first post-merge deploy was blocked at
        # Step 4a by 5 files the repo didn't know about (Aaron's
        # hydra-heal.sh and 4 CMO b2b-target CSVs). If this gate had
        # existed at the time, PR #68 would have failed validation
        # with the file list and we'd have added the excludes before
        # merging instead of fix-forwarding in PR #69.
        run: |
          set -euo pipefail
          # Extract and eval the RSYNC_EXCLUDES array declaration from
          # deploy.sh so this gate is always in sync with the deploy's
          # actual excludes. Single source of truth: the array lives in
          # deploy.sh and both the deploy itself and this CI gate read it.
          #
          # sed range anchor: /^)$/ matches ONLY a line that is exactly
          # ")" with nothing else. This is tighter than /^)/ which would
          # match any line starting with ")" (e.g., ")  # comment" or
          # ") ; do_something") and could terminate the sed range early.
          # The array's closing paren in deploy.sh must be at column 0
          # on a line by itself — documented invariant.
          #
          # Pre-initialize RSYNC_EXCLUDES=() so set -u doesn't fire with
          # a cryptic "unbound variable" error if the sed range fails to
          # match anything. The explicit length check below then emits
          # a clear actionable error.
          RSYNC_EXCLUDES=()
          eval "$(sed -n '/^RSYNC_EXCLUDES=(/,/^)$/p' scripts/deploy.sh)"
          # Guard: self-calibrating. Independently count the --exclude= lines
          # in the array block and require the eval'd array to match exactly
          # (catches an eval that silently drops entries) and to clear a modest
          # floor (catches gross truncation / total failure). Replaces the old
          # hardcoded "expected ≥15 (deploy.sh has 19)", which went stale as
          # the array grew past 60 entries and would no longer catch a 40-entry
          # truncation.
          # The array holds --exclude= lines plus targeted --include= overrides
          # (e.g. skills-all/<skill>/config/ carve-outs from the unanchored
          # config/ exclude) — count both.
          #
          # ANCHORED, so only real array ENTRIES count. The unanchored form
          # matched any line mentioning a flag, comments included, so writing a
          # comment that named the flag it was explaining inflated `declared` by
          # one and failed this gate — reporting "the array format likely
          # changed" when nothing about the format had. Observed on PR #881.
          declared=$(sed -n '/^RSYNC_EXCLUDES=(/,/^)$/p' scripts/deploy.sh | grep -cE '^[[:space:]]*--(exclude|include)=')
          if [ "${#RSYNC_EXCLUDES[@]}" -ne "$declared" ] || [ "${#RSYNC_EXCLUDES[@]}" -lt 15 ]; then
            echo "::error::RSYNC_EXCLUDES extraction problem: eval'd ${#RSYNC_EXCLUDES[@]} entries but the deploy.sh array block declares $declared --exclude=/--include= lines (expected equal, and ≥15). The sed range or array format likely changed."
            exit 1
          fi
          echo "Sourced ${#RSYNC_EXCLUDES[@]} exclude/include patterns from deploy.sh"
          echo "---"
          # Run the rsync dry-run with both stdout and stderr redirected
          # to a tempfile, and check rsync's exit code EXPLICITLY before
          # grepping. The previous implementation used:
          #     deletions=$(rsync ... 2>&1 | grep '*deleting' || true)
          # That pattern silently swallowed rsync failures: if rsync exited
          # non-zero (target missing, permission denied, network error),
          # its stderr flowed through 2>&1 into grep, grep filtered it out,
          # and `|| true` converted the non-zero exit to 0 — making the
          # gate report "zero deletions" when the dry-run never actually
          # ran correctly. Worse than useless: false confidence.
          rsync_out=$(mktemp)
          trap 'rm -f "$rsync_out"' EXIT
          rsync_rc=0
          rsync -an --delete --itemize-changes \
            "${RSYNC_EXCLUDES[@]}" \
            ./ /opt/hydra/ >"$rsync_out" 2>&1 || rsync_rc=$?
          if [ "$rsync_rc" -ne 0 ]; then
            echo "::error::rsync dry-run failed (exit $rsync_rc) — preflight gate could not run. The gate cannot certify this PR is safe to deploy until the rsync error is resolved."
            echo
            echo "rsync output:"
            sed 's/^/  /' "$rsync_out"
            exit 1
          fi
          # rsync succeeded. Grep the captured output for any deletion
          # markers. `|| true` here is correct because it only covers
          # grep's "no match found" exit (which means zero deletions —
          # the pass case).
          deletions=$(grep '^\*deleting' "$rsync_out" || true)

          # Apply the same auto-exclude classifier the deploy uses for
          # Step 4a. Any `workspaces/<ws>/<subdir>/` deletion where git
          # has never tracked content at that subdir is agent-authored
          # runtime state — expected, not drift. Remaining deletions
          # (tracked paths, skills-all/, etc.) stay suspicious and
          # fail the gate. Fail-closed: the classifier returns non-zero
          # on git unavailability or empty-tracked-set mismatches.
          if [ -n "$deletions" ]; then
            # shellcheck disable=SC1091
            . scripts/lib/classify-deletions.sh
            classified=$(classify_workspace_deletions "$deletions" "$(pwd)") || {
              echo "::error::auto-exclude classifier refused to run — refusing to rubber-stamp deletions"
              exit 1
            }
            deletions=$(echo "$classified" | sed -n 's/^REMAIN: //p')
            auto=$(echo "$classified" | sed -n 's/^AUTO: //p')
            if [ -n "$auto" ]; then
              echo "Auto-excluded $(echo "$auto" | wc -l | tr -d ' ') never-tracked workspace subdirectory/ies:"
              echo "$auto" | sed 's/^/  + /'
            fi
          fi

          # Attribute what is left (MUS-1390). A deletion the PR's own diff
          # causes blocks (the author can fix it); unrelated node-8 state only
          # warns, because no PR author can clean it and a check that is red on
          # every PR carries no signal. deploy.sh Step 4a (hydra#1117) only governs an
          # explicit HYDRA_FULL_SYNC=1 deploy; the delta-mode deploy a merge
          # triggers never reaches it. Same lib as the tests.
          if [ -n "$deletions" ]; then
            # shellcheck disable=SC1091
            . scripts/lib/attribute-deletions.sh
            # Baseline: what rsync would delete under the BASE's excludes. A
            # residual deletion missing from it is exposed by this PR removing
            # or narrowing an RSYNC_EXCLUDES entry (git shows no removed path).
            attr_rc=0
            baseline=$(base_exclude_deletions "$(pwd)" /opt/hydra origin/main) || attr_rc=$?
            if [ "$attr_rc" -ne 0 ]; then
              echo "$baseline"
              exit 1
            fi
            attribute_deletions "$deletions" "$(pwd)" origin/main "$baseline" || attr_rc=$?
            if [ "$attr_rc" -ne 0 ]; then
              exit 1
            fi
            echo "Deploy pre-flight: no deletion is caused by this PR (warnings above are unrelated node-8 state)"
            exit 0
          fi
          echo "✓ No deletion found against the live /opt/hydra tree under this PR's excludes"

      - name: Skill drift 3-way gate (server-ahead / conflict vs node-8)
        # Shift-left of the deploy's baseline-aware skill-drift check
        # (scripts/lib/drift-check.sh, used by deploy.sh Step 4a). Surfaces
        # SERVER-AHEAD edits (capture them) and CONFLICTs (reconcile) BEFORE
        # merge, while letting the PR's own REPO-AHEAD edits through (the
        # #366 false-block fix). Runs on the self-hosted runner so /opt/hydra/
        # is local. The merge-triggered (delta-mode) deploy does not run Step 4a;
        # it only governs an explicit HYDRA_FULL_SYNC=1 deploy. This gate is
        # intentionally stricter than the deploy (it does not honor the
        # hot-patch ack window) and warns-not-blocks when no node-8 baseline
        # is available.
        run: |
          set -euo pipefail
          chmod +x scripts/pr-skill-drift-gate.sh
          REPO_ROOT="$(pwd)" SERVER_ROOT=/opt/hydra scripts/pr-skill-drift-gate.sh

      - name: Cron job orphan check
        # Shift-left of deploy.sh's store-only cron guard. Dumps the LIVE
        # SQLite cron store (scripts/lib/dump-cron-store.sh, the same read the
        # deploy does) and runs scripts/lib/detect-store-only-crons.py against
        # this PR's cron-jobs.json, so a PR that would make deploy Step 5a halt
        # ("refusing to drop live state") goes red here instead.
        # MUS-3346: this step used to read /root/.openclaw-main/cron/jobs.json,
        # which the 7.x runtime never writes, and `exit 0`'d when it was
        # absent — green on every PR. It now FAILS CLOSED when the store or SDK
        # is missing; there is no skip branch.
        run: |
          set -euo pipefail
          if [ ! -f cron-jobs.json ]; then
            echo "::error::cron-jobs.json missing from the repo — cannot check for orphaned crons"
            exit 1
          fi
          STORE_DUMP=$(mktemp)
          trap 'rm -f "$STORE_DUMP"' EXIT
          if ! OPENCLAW_STATE_DIR=/root/.openclaw-main scripts/lib/dump-cron-store.sh "$STORE_DUMP"; then
            echo "::error::could not read the live cron store on this runner — the orphan check cannot run (fail-closed)"
            exit 1
          fi
          if ! python3 scripts/lib/detect-store-only-crons.py cron-jobs.json "$STORE_DUMP"; then
            echo "::error::live cron store holds recurring cron(s) not in cron-jobs.json — deploy Step 5a will block"
            echo "Fix: commit the job to cron-jobs.json, or convert a watch-cron to a self-re-arming one-shot (see detect-store-only-crons.py)"
            exit 1
          fi
          echo "✓ No durable store-only crons — every live recurring cron is in cron-jobs.json"

      - name: Plugin env-var preflight (shift-left of deploy.sh Step 4d)
        # Mirrors scripts/deploy.sh Step 4d / install_plugin's call to
        # verify_plugin_env_for_profile against /etc/openclaw/<profile>.env
        # on the self-hosted hydra runner (node-8). Added 2026-05-12 after
        # Deploy HYDRA #163 failed post-merge on commit d167108: PR #270
        # extended support-tools to load on the edge profile but the three
        # secrets it references (CLICKUP_API_KEY, MUSO_ADMIN_EMAIL,
        # MUSO_ADMIN_PASSWORD) had only ever been provisioned in
        # /etc/openclaw/main.env. PR validation passed because no gate
        # invoked the deploy guard at PR time. Same shift-left pattern
        # PR #275 applied to the rsync --delete preflight.
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/lib/plugin-env.sh
          . scripts/lib/plugin-env.sh

          # Enumerate every plugin entry across both profile configs and
          # intersect with plugins/<name>/ on disk. We only check plugins
          # the deploy actually installs (scripts/deploy.sh Step 4d loops
          # over plugins/*/ — built-in openclaw stock plugins like "slack"
          # appear in config entries but are not installed from this repo
          # and have no env-var validation to perform).
          entries=$(jq -r '.plugins.entries // {} | keys[]' openclaw-main.json openclaw-edge.json 2>/dev/null | sort -u)
          if [ -z "$entries" ]; then
            echo "No plugins.entries found in either config — nothing to check"
            exit 0
          fi
          plugins=""
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if [ -d "plugins/$p" ]; then
              plugins="${plugins}${p}"$'\n'
            else
              echo "  (skip $p — not a repo plugin, deploy.sh does not install it)"
            fi
          done <<< "$entries"
          if [ -z "$plugins" ]; then
            echo "No repo plugins found in plugins.entries — nothing to check"
            exit 0
          fi

          fail=0
          while IFS= read -r plugin; do
            [ -z "$plugin" ] && continue
            for profile in $(plugin_profile "$plugin"); do
              echo "→ checking $plugin / $profile"
              verify_plugin_env_for_profile "$plugin" "$profile" "$PWD" || fail=1
            done
          done <<< "$plugins"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Plugin env-var preflight failed — see lines above for which (plugin, profile) pair is missing which variables. Fix the profile env file on node-8 before merging."
            exit 1
          fi
          echo "✓ All plugin env-var references resolve in /etc/openclaw/{shared,<profile>}.env"

  bats-tests:
    name: Bats (scripts/ + ops-admin gates) (${{ matrix.shard }}/2)
    # Added 2026-05-20 after PR #297: Clio caught a `set -u` regression in
    # find-dupes.sh --catalog that emitted "unbound variable" to stderr
    # while still exiting 0 — bats picked it up locally but the suite
    # never ran in CI, so the PR merged green. Wire it in here so future
    # PRs can't ship a regression the suite already covers.
    #
    # 2026-10-27: on the in-cluster `ovh-hydra` ARC fleet, off node-8 (see the note above
    # `validate`), and SHARDED in two. A runner pod gets 1 CPU requested / 2 CPU limit, not
    # node-8's 24 cores, so one job at `--jobs 8` would be ~4x oversubscribed and the
    # timing-sensitive watchdog suites would miss deadlines nondeterministically — the very
    # failure #1403 measured on node-8. Two shards at `--jobs 4` each split the files
    # round-robin from the slowest-first list below, so each shard gets every other long pole.
    runs-on: ovh-hydra
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Until 2026-10-27 this job ran ON node-8, as root, where /etc/hydra/jev.env holds the real Jev
    # key and /var/lib/hydra-jev/shadow is the PRODUCTION shadow log that the
    # Phase 3 decisions are made from. Any test that reaches a real jev.sh or a
    # default shadow path without overriding it would make a real API call
    # with fixture data and append that row to production. It did: 2026-09-23
    # found 181 fixture rows there, some with rc 0 from real calls, including
    # rows written by this job after #1013 merged. These defaults fence every
    # test in this job off at once; a test that needs a key or a dir still sets
    # its own, which overrides these. On ovh-hydra those files do not exist at all, so the
    # fence is now belt-and-braces; it stays so a re-run on node-8 (rollback) is still safe.
    env:
      JEV_ENV_FILE: /dev/null
      JEV_SHADOW_DIR: /tmp/hydra-ci-jev-shadow-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
      JEV_EVAL_DIR: /tmp/hydra-ci-jev-eval-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
      MUSO_SLACK_ENV_FILE: /dev/null
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # FULL history, not the default depth-1. scripts/tests/credit-gate-probe.bats
          # reconstructs the real pre-#740 / pre-#750 muso-admin-api.sh from git
          # (`git show <rev>^:...`) so its negative cases are anchored on gates that
          # actually regressed, not hand-written mocks. Those revs are absent from a
          # shallow clone. They resolved for months only because the single long-lived
          # runner's work dir had accumulated the objects incidentally; adding runners
          # on 2026-08-03 put the job on a fresh work dir and the fixtures vanished.
          #
          # fixture_at now degrades to `skip` rather than a bogus failure, so this is
          # not about red CI — it is about COVERAGE. A skip silently retires the only
          # tests proving the probe CAN FAIL, which is precisely the "unverified
          # becomes a green tick" outcome that file's header exists to prevent. Pin
          # the depth so those cases actually RUN on every runner, new or old.
          fetch-depth: 0
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh

      - name: Ensure bats + parallel + jq + sqlite3 + node installed
        # scripts/ci/arc-toolchain.sh: bats, GNU parallel (`bats --jobs` refuses to run
        # without it), sqlite3 (rollback.bats and deploy-plugin-pin-stops-gateway.bats build
        # state-DB fixtures with it; without it they die rc=127 — MUS-5079), and node >= 22
        # (the image's node 20 has no node:sqlite, which ~50 cases drive).
        run: bash scripts/ci/arc-toolchain.sh bats

      - name: Run all bats suites under scripts/ + ops-admin gate tests
        # Discovers every *.bats file under scripts/ so a future
        # sibling suite (e.g., scripts/credit-verification/tests) is
        # picked up automatically without another CI edit. Current
        # coverage: scripts/dedup/tests/ (84 tests, find-dupes modes,
        # score-pair matrix, sweeps, create-ticket capture contract)
        # and scripts/tests/openclaw-config-write-audit.bats (the
        # write-audit watcher gate).
        #
        # ALSO discovers the muso-admin-api.sh gate suites (tier-2 approval,
        # credit-approve, dry-run, bulk-destructive — added with the
        # 2026-05-26 bulk-destructive gate). These live next to the workspace
        # script and had never run in CI. Scoped to that one tests dir on
        # purpose: a blanket `find workspaces` would also drag in ~30 never-run
        # credit-verification suites and could block every PR. All four are
        # hermetic (closed-port MUSO_API_URL, no openclaw binary invocation).
        #
        # ALSO the muso-caroline-weekly-review (daily review) suite, added so the
        # reasoning-leak mirror's drift sentinel actually gates (scan-shipped-leaks
        # mirrors sanitize-reasoning-leak.ts patterns; the sentinel fails if they
        # drift). Hermetic: helpers.bash PATH-shadows openclaw/gh/curl/journalctl.
        # Same scoping rationale — one tests dir, not a blanket workspace find.
        #
        # ALSO the credit-verification fraud-scorer suite (score-fraud-signals.bats,
        # added with the 2026-06 CV_FRAUD_MODE detector) and the
        # fraud-muso-only-lookup suite (the generated-SQL regression anchor for
        # the 2026-06-11 `_id` column incident — a suite that exists but isn't
        # listed here is dead in CI, which is how that bug shipped). Pinned as
        # single FILE operands on purpose: their tests/ dir holds ~28 sibling
        # suites that have never run in CI (the "blanket find workspaces"
        # hazard above). Hermetic: helpers.bash PATH-shadows openclaw, Trino
        # access goes through stubbed fraud-muso-only-lookup fixtures.
        #
        # ALSO verify-credit-request-status.bats (the Trino readback that
        # closes the "PUT /admin/credit-requests returns 200 with zero rows
        # transitioned" gap) and batch-flag-credits.bats — the latter existed
        # but was NEVER pinned here, so it was dead in CI until now. Both are
        # hermetic (TRINO_QUERY_SH / VERIFY_STATUS_SH stubbed, no network).
        #
        # ALSO render-slack-summary.bats — the Slack outcome-contract suite that
        # covers the transport_error rendering added with the apply-transport
        # hardening. Same rationale: unlisted here == dead in CI. Hermetic (no
        # network, no Slack token).
        #
        # ALSO apply-verdicts-attribution.bats — the per-row attribution of the
        # admin API's response. The sweep used to mark a whole chunk landed on
        # any 200 and refused on any non-2xx, so rows the backend had reported
        # as skipped were counted applied, and rows that really persisted were
        # counted failed. Hermetic (ADMIN_API_SH stubbed with fixed envelopes).
        #
        # ALSO results-per-row-attribution.bats — the same attribution on the
        # OTHER surface: muso-admin-api.sh's .results.jsonl truth floor and the
        # compute-run-summary.sh reconciliation built from it. End-to-end
        # (wrapper → ledger → canonical summary) with `curl` stubbed, so a
        # partially successful 409 can never again reconcile as zero landed.
        #
        # ALSO dispatch-cv-batch.bats — since 2026-10-11 it carries the real-apply
        # approval gate: a real run (cron or @Ops Slack trigger) is forced DRY
        # unless policies/credit-approval-automation.json approves it. The
        # pipeline's old approve rule was inverted and approved validator-declined
        # credits; this suite is what proves a real run cannot happen by default.
        # Hermetic (curl stubbed, tmpdir state, tmpdir write lock).
        #
        # ALSO score-backend-signals.bats: the batch's approve rule. Until
        # 2026-10-11 it was inverted (approve_owning_track == 100 means the
        # shortcut did NOT fire) and approved validator-declined credits. This
        # suite pins the replacement: only validator-approved rows approve.
        #
        # ALSO customer-credit-removal/tests/remove-credits.bats (30 tests on the
        # credit-removal wrapper's refusals and dry-run-before-apply gate). It
        # lives under tests/, not scripts/tests/, and its skill was never pinned,
        # so it had never run in CI (MUS-10237). Hermetic (curl stubbed).
        run: |
          set -euo pipefail
          # The self-hosted runner may carry production bot credentials. Bats
          # suites must opt into fake credentials after launch; none may inherit
          # a real token and accidentally activate an alert path.
          while IFS='=' read -r name _; do
            case "$name" in
              MUSO_SLACK_BOT_TOKEN_*) unset "$name" ;;
            esac
          done < <(env)
          export MUSO_SLACK_ENV_FILE=/dev/null
          # skills-all/ suites auto-enroll via the dir scan: pin-each-suite
          # leaked there (muso-devops-prod-logs' suite existed but never ran
          # in CI). Collected via a loop, not a bare glob operand, so zero
          # matches degrades to the soft-skip below instead of find exiting 1
          # on an unexpanded glob literal. The workspaces/ operands stay
          # pinned per the rationale above — a blanket find would drag in
          # ~30 never-run CV suites.
          sa_dirs=()
          for d in skills-all/*/scripts/tests; do
            [ -d "$d" ] && sa_dirs+=("$d")
          done
          files=$(find scripts \
                       workspaces/operations/skills/muso-ops-admin/scripts/tests \
                       workspaces/operations/skills/muso-caroline-weekly-review/scripts/tests \
                       workspaces/operations/skills/muso-support-email-triage/scripts/tests \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/apply-verdicts.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/compute-run-summary.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/score-fraud-signals.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/fraud-muso-only-lookup.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/fraud-muso-only-snapshot-writer.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/render-dry-run-summary.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/verify-credit-request-status.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/batch-flag-credits.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/render-slack-summary.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/apply-verdicts-attribution.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/results-per-row-attribution.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/dispatch-cv-batch.bats \
                       workspaces/operations/skills/muso-ops-credit-verification/scripts/tests/score-backend-signals.bats \
                       workspaces/operations/skills/muso-ops-fastlane/scripts/tests \
                       workspaces/support/skills/order-fulfillment/scripts/tests \
                       workspaces/support/skills/customer-credit-removal/tests \
                       "${sa_dirs[@]}" \
                       -type f -name '*.bats' | sort)
          if [ -z "$files" ]; then
            echo "::warning::no *.bats files found — skipping"
            exit 0
          fi
          count=$(echo "$files" | wc -l | tr -d ' ')
          echo "Discovered $count bats file(s) across both shards."
          # Parallel across FILES, serial within a file (MUS-11315, from the MUS-7954
          # audit on node-8: corpus 1493 s serial -> 279 s at --jobs 8, identical
          # 6497-test name set). Slowest files go first so the long poles start at
          # once (merge-landing-watchdog 178 s, rollback 121 s, close-duplicate 82 s).
          # --jobs 8 was the throughput knee: 16 buys 33 s because merge-landing-watchdog
          # is the floor. Do NOT add within-file parallelism: 423 s and 4 tests break.
          #
          # 2026-10-27: 8 -> 4. The knee was measured when this job was the only thing
          # on the box; it is not. node-8 also runs the PRODUCTION openclaw gateway
          # (7.2 GiB RSS, ~29 % CPU), openclaw-edge, longhorn-manager and argocd, and
          # with the cross-PR cap above (one validation at a time) a SINGLE --jobs 8
          # suite still measured load 30.4 / CPU-pressure PSI 24.9 % at 19:01Z with
          # nothing else in flight. Under that pressure the watchdog suites miss their
          # deadlines nondeterministically — the failure mode that blocked five PRs.
          # Cost: the suite is bounded by corpus/4 ~ 373 s (merge-landing-watchdog's
          # 178 s floor still dominates), against 279 s at 8 — ~90 s per PR, cheaper
          # than an hour of red.
          # Rollback: `--jobs 8 --no-parallelize-within-files` is still the throughput
          # knee IF this job ever runs on a box that is not also serving production.
          #
          # 2026-10-27 (later, PR CI off node-8): this job now runs on the in-cluster
          # `ovh-hydra` ARC fleet (2 CPU limit per pod, see the job header), so the corpus is
          # split over two shards at --jobs 4 each. Measured in the ovh-ubuntu r8 image as
          # `runner`, capped at 2 CPU / 2Gi: shard 1 3,664 cases in 489 s, shard 2 4,084 in
          # 496 s. --jobs 4 also keeps pr-validate-node8-cap.bats' bound if a rollback puts
          # this job back on node-8.
          slow="scripts/tests/merge-landing-watchdog.bats
          scripts/tests/rollback.bats
          scripts/tests/close-duplicate-conversations.bats
          scripts/tests/prod-log-alert-watchdog.bats
          scripts/tests/sync-help-centre.bats
          scripts/tests/deploy-agents-bound-probe.bats
          scripts/tests/support-changelog-sync.bats
          scripts/tests/rollback-preserves-mcp.bats
          scripts/tests/codex-quota-probe.bats
          scripts/tests/qa-approval-retry.bats
          scripts/tests/cron-store.bats
          scripts/tests/qa-review-reconcile.bats"
          ordered=$( { for f in $slow; do grep -Fx -- "$f" <<<"$files" || true; done
                       grep -vFx -- "$slow" <<<"$files" || true; } )
          # Round-robin over the slowest-first order, so each shard gets every other long
          # pole. Every discovered file lands in exactly one shard; the count check below
          # makes a dropped file a red job, not a silently shorter suite.
          shard="${{ matrix.shard }}"
          mine=$(awk -v n=2 -v i="$shard" 'NF && (NR - 1) % n == i - 1' <<<"$ordered")
          other=$(awk -v n=2 -v i="$shard" 'NF && (NR - 1) % n != i - 1' <<<"$ordered")
          total=$(( $(grep -c . <<<"$mine" || true) + $(grep -c . <<<"$other" || true) ))
          if [ "$total" -ne "$count" ]; then
            echo "::error::shard split covers $total of $count discovered bats files"
            exit 1
          fi
          echo "Shard $shard/2 runs $(grep -c . <<<"$mine" || true) of $count file(s):"
          echo "$mine" | sed 's/^/  /'
          # HOST-WIDE SLOT (2026-10-27 ruling): at most one bats suite per box. The
          # flock is per host, not per runner service, so the several hydra runners on
          # node-8 cannot each start a suite. Waiting is bounded (45 min) and a timeout is
          # an ::error:: + non-zero exit — never a silent skip, never an unslotted run.
          # On an ovh-hydra pod the box IS the pod, so the slot is always free there; it
          # stays so a rollback to node-8 keeps the cap without another edit.
          # `host-systemd` cases drive the real systemd-run, which a pod does not have; they
          # run in the node-8 job instead (node8-handoff), so each case still runs exactly once.
          # shellcheck disable=SC2086
          scripts/bats-slot.sh --lock /var/lock/hydra-bats.lock --timeout 2700 -- \
            bats --jobs 4 --no-parallelize-within-files --filter-tags '!host-systemd' $mine

  py-syntax:
    name: Python syntax check (py_compile)
    # Added 2026-05-20 alongside the bats wiring: 44 .py files exist
    # under scripts/, skills-all/, and workspaces/ but nothing in CI
    # catches a syntax typo before deploy. py_compile is ~5s and
    # surfaces typos / mis-paste / partial saves immediately.
    # 2026-10-27: ovh-hydra (stdlib python3 only; see the note above `validate`).
    runs-on: ovh-hydra
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh
      - name: py_compile every .py file in operational paths
        run: |
          set -euo pipefail
          files=$(find scripts skills-all workspaces -type f -name '*.py' 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "No .py files found — skipping"
            exit 0
          fi
          count=$(echo "$files" | wc -l | tr -d ' ')
          echo "Compiling $count file(s)…"
          # shellcheck disable=SC2086
          python3 -m py_compile $files
          echo "✓ All Python files parse cleanly"

  py-tests:
    name: Python unit tests (watchdog)
    # Added 2026-06-03 (PR #411): the Intercom intake-outage watchdog
    # (scripts/intercom-intake-watchdog.py) is the ONLY tripwire for the
    # April-2026 silent-intake-outage class. py_compile (above) proves it
    # parses; this proves its health *decisions* still hold — is_processed's
    # ai:*/admin-reply/closed signals, pagination, the threshold/min-volume
    # judgement, alert-vs-no-alert, and clean exits on API/usage errors.
    # Stdlib unittest only (no pip, no network) — same bare python3 as
    # py-syntax. Target the module by name on purpose: a broad discover would
    # import the pytest-based tests/ outreach suite, which has no CI deps.
    # 2026-10-27: ovh-hydra (see the note above `validate`). The forensics suites need
    # PyMuPDF / OpenCV / Pillow / tesseract, which node-8 had installed by hand; the pod gets
    # node-8's exact versions from scripts/ci/requirements-arc.txt.
    runs-on: ovh-hydra
    # Until 2026-10-27 this job ran ON node-8, as root, where /etc/hydra/jev.env holds the real Jev
    # key and /var/lib/hydra-jev/shadow is the PRODUCTION shadow log that the
    # Phase 3 decisions are made from. Any test that reaches a real jev.sh or a
    # default shadow path without overriding it would make a real API call
    # with fixture data and append that row to production. It did: 2026-09-23
    # found 181 fixture rows there, some with rc 0 from real calls, including
    # rows written by this job after #1013 merged. These defaults fence every
    # test in this job off at once; a test that needs a key or a dir still sets
    # its own, which overrides these.
    env:
      JEV_ENV_FILE: /dev/null
      JEV_SHADOW_DIR: /tmp/hydra-ci-jev-shadow-${{ github.run_id }}-${{ github.job }}
      JEV_EVAL_DIR: /tmp/hydra-ci-jev-eval-${{ github.run_id }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Host preflight — /dev/null must be a char device
        run: bash scripts/assert-host-devnull.sh
      # The wheels are ~100 MB (OpenCV, PyMuPDF, numpy); cache the downloaded wheels so a
      # fresh pod does not refetch them from PyPI on every run. Keyed on the pin file.
      - name: Cache pinned wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/hydra-ci/wheels
          key: hydra-pip-${{ runner.os }}-${{ hashFiles('scripts/ci/requirements-arc.txt') }}
      - name: Ensure tesseract + pinned python wheels installed
        run: bash scripts/ci/arc-toolchain.sh python
      - name: Run watchdog behavioral tests
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_intercom_intake_watchdog
      - name: Run paperclip-intake tests
        # scripts/paperclip-intake.py is how agents file Paperclip cards: the
        # fingerprint port (hydra#1002), exact-token dedupe, the zero-token
        # pre-check that decides whether Clio's triage is woken, and the
        # 30-minute escalation. Local-only fake API; stdlib unittest, by name.
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_paperclip_intake
      - name: Run store-only cron guard tests
        # scripts/lib/detect-store-only-crons.py is the deploy gate that HALTS if
        # the live SQLite cron store holds a recurring cron absent from
        # cron-jobs.json — preventing the silent deletion of a live-created cron
        # (incident 2026-07-16: Aaron's ChartMogul crons, PR #702). Locks the
        # durable-orphan detection, the ephemeral (deleteAfterRun+at) exemption,
        # and the HYDRA_ALLOW_ORPHAN_CRON downgrade. Same bare stdlib unittest,
        # targeted by name (no pytest/network).
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_detect_store_only_crons
      - name: Run close-resolved-conversations predicate tests
        # The unattended daily close job (scripts/close-resolved-conversations.py)
        # silently closes customer conversations; these lock its is_eligible
        # safety predicate (we-spoke-last + precise #417-link tie) so a
        # regression can't bury live conversations unnoticed. Same bare
        # stdlib unittest, targeted by name (no pytest/network).
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_close_resolved_conversations
      - name: Run customer-outcome contract tests
