        # (incident 2026-07-16: Aaron's ChartMogul crons, PR #702). Locks the
        # durable-orphan detection, the ephemeral (deleteAfterRun+at) exemption,
        # and the HYDRA_ALLOW_ORPHAN_CRON downgrade. Same bare stdlib unittest,
        # targeted by name (no pytest/network).
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_detect_store_only_crons
      - name: Run claim-proof-ask reader alarm tests
        # scripts/claim-proof-check-watchdog.py is why claim-proof-ask may carry a send date at all (p1 rule 8 /
        # #1758 Important 1): the 30h freshness gate refuses NEW asks when the daily code check is stale and says
        # nothing about the asks already out. These lock its decisions - healthy, missing heartbeat, stale
        # heartbeat, stale digest, a digest that names nothing, asks the reader never looked at, held rows that are
        # not asks, and "cannot measure" instead of a false healthy. Run by FILE PATH, like its sibling
