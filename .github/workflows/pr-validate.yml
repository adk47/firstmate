      - name: Run cs-selfserve-backlog tests
        # scripts/cs-selfserve-backlog.py is a READ-ONLY monthly signal report
        # (Phase 3): it sweeps the edge support trajectory JSONL, counts
        # create_ticket calls by actionType, and ranks which MISSING self-serve
