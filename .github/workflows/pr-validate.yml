      - name: Run close-duplicate-conversations tests
        # scripts/close-duplicate-conversations.py is a ONE-WAY-DOOR sweeper
        # (Phase 1, ships SHADOW-MODE ONLY — no --apply on the systemd
        # timer). These lock the deterministic Tier A/B gates, the
