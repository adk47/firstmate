name: qa-autoreview

# Auto-review of Nick's hydra PRs by the QA agent.
#
# Fires AFTER the "PR Validation" workflow (pr-validate.yml) completes (so CI is settled before
# we decide "green"), resolves the PR, scope-guards it, and dispatches the qa
# agent to run the muso-github-code-review skill in auto mode. See
# scripts/qa-dispatch-pr-review.sh and skills-all/muso-github-code-review/SKILL.md.
#
# workflow_run runs from the DEFAULT-branch copy of this file, so a PR branch
# cannot alter the trigger, the scope guard, or the dispatcher it calls
# (the checkout below is the default branch, not the PR head). Approval is gated
# in the skill + qa-pr-approve.sh to CI-green + GO verdict + allowlist, and it
# NEVER merges — a human merges.

# Coordinates in the run name so scripts/qa-dispatch-pr-review.sh can see an in-flight
# review for the same (repo, pr, sha) straight from `gh run list` (MUS-7955). Same shape
# as external-pr-review.yml's run-name. Empty pr (fork PR) never matches: fail open.
run-name: "qa ${{ github.repository }}#${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }} @ ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }} (autoreview)"

on:
  workflow_run:
    # Must match the validation workflow's `name:` ("PR Validation"), NOT its
    # filename (pr-validate.yml) — workflow_run keys off the workflow name.
    workflows: ["PR Validation"]
    types: [completed]

  # Manual re-dispatch — the recovery path for a review that was dispatched and then LOST.
  #
  # WHY THIS EXISTS (2026-11-06, incident): the dispatch below is fire-and-forget — it
  # registers a one-shot openclaw cron job and returns. If the gateway restarts before that
  # job runs, the job is removed and the review is aborted with `Operation aborted | Cron job
  # removed by operator.` and NOTHING retries it: this workflow's only other trigger is
  # `workflow_run`, and the PR Validation run that fired it has already completed, so it
  # never fires again for that head. On 2026-11-06 the 05:42Z deploy's gateway reload drained
  # with `timeout 0ms` at 05:48:26Z and killed hydra#1799's review 40s after dispatch, and
  # hydra#1800's 26s in; both heads then sat with NO `qa-review` status at all (hydra is not
  # in `merge_gate_repos`, so the `pending` seed is a no-op and a lost dispatch leaves no
  # trace). The only recovery was to re-run PR Validation, which re-runs 20-60 min of CI to
  # re-fire a 10-second hand-off.
  #
  # This is the narrow fix: re-fire the hand-off for a named (pr, sha) without re-running CI.
  # It deliberately does NOT add a retry-on-abort or a stale-pending sweep — those need the
  # watchdog described in policies/qa-approval-policy.json `_field_notes`, and a sweep that
  # re-dispatches on its own could double-review a head that is merely slow.
  #
  # Both inputs are REQUIRED and are checked against live state before anything is dispatched
  # (see "Manual re-dispatch guards" below): a stale sha would post a verdict on a superseded
  # commit, which is worse than no verdict.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to re-review (must be open, non-draft, base main)"
        required: true
        type: string
      sha:
        description: "Head SHA to review — must still be the PR's current head"
        required: true
        type: string

permissions:
  # actions: read lets the dispatcher's `gh run list` in-flight dedup work; without it the
  # lookup fails and every dispatch takes the DEDUP-SKIPPED fail-open path.
  actions: read
  contents: read
  pull-requests: read
  # Needed for the qa-review gate status below. NOTE: this covers the fallback
  # path only. Once `qa-review` is a required check pinned to the QA bot App
  # (checks:[{context,app_id}]), the status must be posted BY THE APP to satisfy
  # the pin — a status from github.token reports as github-actions[bot], a
  # different app, and would not count. So hydra must be on the App identity
  # (policies/qa-approval-policy.json .identity.app_repos) before the pin is set.
  statuses: write

jobs:
  dispatch:
    # Same on-box HOST (node-8) as pr-validate; the openclaw CLI + gateway live here.
    # 2026-10-12 (H-DevOps lane, firstmate 5383/5385): own runner label. This job is a ~7-10 s hand-off to the
    # on-box gateway, but on the shared [self-hosted, hydra] pool it queued FIFO behind pr-validate's 20-25 min
    # Bats jobs: 65 queued, 20:12 -> ~22:10Z dispatch latency ~2 h on 10-12. Runners labelled hydra-dispatch
    # (and NOT hydra) serve only dispatches. PRECONDITION: >= 1 online runner carries hydra-dispatch BEFORE
    # this merges, or every dispatch queues forever. Revert = put back [self-hosted, hydra].
    runs-on: [self-hosted, hydra-dispatch]
    # pr-validate only runs on pull_request, but guard explicitly anyway. A manual
    # re-dispatch has no workflow_run payload, so it is admitted on its own event name.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Checkout (default branch — main's dispatcher, not PR code)
        uses: actions/checkout@v5

      - name: Resolve PR, scope-guard, and dispatch QA auto-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          # Arm the gate FIRST, before any API call can fail. REPO and HEAD_SHA
          # come from the event context with no network involved, so this is the
          # one point that is reachable on every path. Everything below (the PR
          # lookup, the policy read, jq) can fail and abort the step under
          # `set -e`; without this seed those paths would report nothing at all,
          # and GitHub never times out an unreported required check.
          # Parse/validate SEPARATELY from membership. A single `jq -e ... index()`
          # collapses "not gated" and "policy unreadable" into the same false,
          # which would suppress every say_status below and — if branch
          # protection were already App-pinned — leave the required check pending
          # forever. That is the exact silent path this block exists to prevent,
          # so a policy error is loud and fail-closed instead.
          # shellcheck source=scripts/lib/qa-policy.sh
          source scripts/lib/qa-policy.sh
          POL=policies/qa-approval-policy.json
          if ! qa_policy_valid "$POL"; then
            echo "::error::$POL is unreadable or malformed — cannot determine gate state."
            # Post a failure rather than nothing: on a gated repo silence is a
            # permanent block, and on an ungated repo a red qa-review is harmless
            # and visible. Best-effort, then fail the run loudly.
            bash scripts/qa-review-status.sh "$REPO" "$HEAD_SHA" failure \
              "QA gate state unknown — $POL is unreadable or malformed" || true
            exit 1
          fi
          # `|| _rc=$?` — qa_policy_has returns 1 for the normal "not gated" case,
          # which would abort this `set -e` step if called bare.
          _rc=0
          qa_policy_has "$POL" '.merge_gate_repos' "$REPO" || _rc=$?
          if [ "$_rc" -eq 2 ]; then
            echo "::error::cannot evaluate .merge_gate_repos in $POL."
            bash scripts/qa-review-status.sh "$REPO" "$HEAD_SHA" failure \
              "QA gate state unknown — .merge_gate_repos unreadable" || true
            exit 1
          fi
          gated=0
          [ "$_rc" -eq 0 ] && gated=1
          say_status() {  # <state> <description> [always] — best-effort, never aborts
            # Gated repos only, EXCEPT a caller that passes `always`: the one
            # write that must land on an ungated repo too (the dispatch-failure
            # red below). Everything else stays silent off the gate.
            [ "$gated" = 1 ] || [ "${3:-}" = always ] || return 0
            bash scripts/qa-review-status.sh "$REPO" "$HEAD_SHA" "$1" "$2" \
              || echo "::warning::could not post qa-review=$1 for ${HEAD_SHA:0:7}"
          }
          say_status pending "QA review queued for ${HEAD_SHA:0:7}"
          # A REFUSAL is not a gate state, so it must not be suppressed by `gated`. `say_status` is a
          # no-op when the repo is not in `.merge_gate_repos` (hydra is not), which meant a manual
          # re-dispatch that refused a stale head failed the job and posted NOTHING on the PR - the
          # operator saw a red run and the PR carried no explanation (QA #1812 finding 2).
          #
          # The refusal lands on the commit a reader will actually look at. For a head-moved
          # refusal that is the PR's CURRENT head, not the superseded sha the operator typed:
          # posting on the stale sha left the requested PR with no visible refusal at all, and
          # could mark a different PR's commit (QA #1812 finding 1). The third argument is the
          # target; it defaults to HEAD_SHA for the case where there is no PR head to use.
          refuse_status() {  # <state> <description> [sha] — always posts, never aborts
            local sha="${3:-$HEAD_SHA}"
            bash scripts/qa-review-status.sh "$REPO" "$sha" "$1" "$2" \
              || echo "::warning::could not post qa-review=$1 for ${sha:0:7}"
          }

          # Resolve the open PR that owns this commit.
          # 2026-10-28 (hydra#1456, run 40787678249): ONE head sha can be the head of several
          # open PRs at once. A stack whose layers point at the same commit, plus the main-based
          # PR that carries it, had 8 PRs on 497b7fcc. Taking the first open PR picked #1409
          # (base fm/...), which skipped as "not main", so the one PR QA gates never got a
          # review. The main-based PR is the only one this workflow reviews, so it wins.
          # Otherwise the first open PR keeps today's skip/pending behaviour.
          #
          # A MANUAL re-dispatch resolves the NAMED PR directly instead of going through the
          # sha->PR lookup. The lookup returns empty for a sha that is the head of no OPEN PR (a
          # closed PR, a branch tip, a typo), and the empty branch below exits 0 - so a manual
          # re-dispatch of such a sha reported a SUCCESSFUL job while dispatching no review and
          # posting no refusal (QA #1812 finding 3). Resolving `INPUT_PR` makes the named PR the
          # subject, so "not open" and "head moved" are both explicit refusals.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            prjson="$(gh api "repos/${REPO}/pulls/${INPUT_PR}" 2>/dev/null || true)"
            if [ -z "$prjson" ] || [ "$(jq -r '.state // ""' <<<"$prjson")" != "open" ]; then
              # NO STATUS IS POSTED HERE, deliberately. The named PR has no verified head, so the only sha we
              # hold is the one the operator typed — and that sha may be the current head of a DIFFERENT open
              # PR. Posting `qa-review=failure` there would overwrite that PR's real verdict with a refusal
              # about a PR it has nothing to do with (QA #1812 r3). A refusal with no safe target belongs in
              # the run log, where the operator who typed the number will look.
              echo "::error::re-dispatch asked for PR #${INPUT_PR}, which is not an open PR — refusing. No status was posted: the supplied sha ${HEAD_SHA:0:7} may belong to another PR."
              exit 1
            fi
            head_now="$(jq -r '.head.sha' <<<"$prjson")"
            if [ "$head_now" != "$HEAD_SHA" ]; then
              echo "::error::PR #${INPUT_PR} head is now ${head_now:0:7}, not ${HEAD_SHA:0:7} — refusing to review a superseded commit."
              # Target the PR's live head: that is where the operator and the merge gate look.
              refuse_status failure "re-dispatch refused: PR #${INPUT_PR} head moved to ${head_now:0:7}" "$head_now"
              exit 1
            fi
            echo "Manual re-dispatch: PR #${INPUT_PR} @ ${HEAD_SHA:0:7} is still the current head — proceeding."
          else
            prjson="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              --jq '[.[] | select(.state=="open")] | ((map(select(.base.ref=="main")) + .)[0]) // empty')"
            if [ -z "$prjson" ]; then
              echo "No open PR for ${HEAD_SHA} — nothing to review."
              exit 0
            fi
          fi

          PR="$(jq -r '.number' <<<"$prjson")"
          AUTHOR="$(jq -r '.user.login' <<<"$prjson")"
          DRAFT="$(jq -r '.draft' <<<"$prjson")"
          BASE="$(jq -r '.base.ref' <<<"$prjson")"

          # Scope: non-draft PRs targeting main by any author with a Slack-UID
          # mapping (scripts/lib/qa-author-slack-uid.sh — the same fail-closed
          # gate the external-repo path uses). Previously hardcoded to Nick,
          # which left every other author's hydra PRs (e.g. adk47's) merging
          # with no automated review — the 2026-07-10 "everything through the
          # QA bot" directive closes that class. The resolved UID rides to the
          # dispatcher as the requester (approve-gate + DM target), replacing
          # the dispatcher's built-in Nick default for non-Nick authors.
          if ! REQUESTER_UID="$(bash scripts/lib/qa-author-slack-uid.sh "$AUTHOR")"; then
            echo "PR #${PR} author=${AUTHOR} has no Slack-UID mapping — skipping auto-review."
            # FAILURE, not silence: QA cannot review this PR, and on a gated repo
            # an unreviewable PR must not become mergeable. Says how to fix it.
            say_status failure "no Slack-UID mapping for ${AUTHOR}; QA cannot review — add it to scripts/lib/qa-author-slack-uid.sh"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "PR #${PR} is a draft — skipping auto-review."
            # Stays pending (a draft cannot merge anyway).
            # CAVEAT for arming: pr-validate.yml declares no `types:`, so it runs
            # on the DEFAULT set (opened/synchronize/reopened) — `ready_for_review`
            # is NOT among them. Marking a draft ready therefore does NOT re-fire
            # this workflow, and the pending would stick until the next push.
            # Adding `ready_for_review` (and `edited`, see the base check below)
            # to pr-validate.yml's triggers is a prerequisite for arming the gate.
            say_status pending "draft — QA review runs when the PR is marked ready"
            exit 0
          fi
          if [ "$BASE" != "main" ]; then
            echo "PR #${PR} base=${BASE} (not main) — skipping auto-review."
            # PENDING, not success. `success` here would be a review bypass: a PR
            # can be retargeted off main while PR Validation runs, which lands a
            # green qa-review on a head SHA nothing reviewed, and retargeting back
            # to main reuses that same SHA. Pending is harmless on an ungated base
            # (the check is only required on main) and cannot be laundered.
            say_status pending "base ${BASE} is not gated — QA review applies to main only"
            exit 0
          fi

          echo "Dispatching QA auto-review of PR #${PR} @ ${HEAD_SHA} (author=${AUTHOR} -> ${REQUESTER_UID})"
          # The gate was already armed `pending` at the top of this step, before
          # any call that could fail. The dispatch below is fire-and-forget (a
          # one-shot cron), so a lost dispatch leaves it pending — which is why
          # the stale-pending watchdog is a hard prerequisite for adding any repo
          # to .merge_gate_repos (it does not exist yet; see that field's
          # _field_notes). Without it, a lost dispatch has no recovery path.
          # A failed dispatch must be VISIBLE ON THE PR, gated or not. This is a
          # workflow_run job, so a red run here is not attached to the PR's checks
          # at all; with .merge_gate_repos empty the gated say_status above posts
          # nothing, and the PR shows exactly what an un-dispatched review shows:
          # no status, no review -- "not yet reviewed", forever, unless a human
          # notices the Actions tab or the reconciler completes a tick (2026-11-06:
          # hydra#1820 @ 086158df, run 42282917209 attempt 1 exited 75 on a gateway
          # handshake timeout and was recovered only by a hand re-run). So this
          # one failure status is posted UNCONDITIONALLY: it is not a verdict and
          # never blocks on an ungated repo (the check is not required there), the
          # reconciler already classifies its "QA review could not be dispatched"
          # prefix as infrastructure (lib/qa-reconcile.sh QAR_INFRA_STATUS_MARKERS
          # -> candidate, so it still re-dispatches), and the real verdict's status
          # overwrites it when the review lands. The prefix is load-bearing.
          _drc=0
          bash scripts/qa-dispatch-pr-review.sh "$PR" "$HEAD_SHA" "$REPO" "$REQUESTER_UID" || _drc=$?
          if [ "$_drc" -ne 0 ]; then
            if [ "$_drc" -eq 75 ]; then
              # Short on purpose: the status description is capped at 140 chars
              # and the run id must survive the cut. Exit 75 covers BOTH the
              # exhausted-retry path and the ambiguous one (a socket that died
              # after the request may have been received, so a one-shot may
              # exist), so this must not assert a queue state the dispatcher
              # cannot prove.
              why="gateway unreachable; review not confirmed queued"
            else
              why="dispatcher exited ${_drc}"
            fi
            run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo "::error::NO QA REVIEW QUEUED for PR #${PR} @ ${HEAD_SHA:0:7}: ${why}. Re-run this job once the gateway answers; the reconciler also retries. ${run_url}"
            # Keep this literal on ONE line: scripts/tests/qa-review-reconcile.bats
            # reads the description out of this file to pin it as non-verdict.
            say_status failure "QA review could not be dispatched — ${why} (run ${GITHUB_RUN_ID})" always
            exit 1
          fi
