# ak47 (2026-11-14): the uid-wide task cap was 12000 and the box reached all
# 12000 of it for five hours, so every fork failed. 12000 was barely above
# normal working size - the slice runs ~4,600 tasks and passes 5,500 after a
# reboot - so ordinary growth could reach the cap while no other ceiling
# (load, swap, RAM) noticed, because tasks are cheap and starvation is sudden.
#
# 24576 is six times the per-unit default set in
# /etc/systemd/user.conf.d/60-ak47-tasksmax-user.conf (4096): the slice cap is a
# backstop for a bug that spawns in many units at once, not the thing that keeps
# one lane honest. Raising it without the per-unit default would move the cliff,
# not remove it.
#
# Revert: sudo rm /etc/systemd/system/user@1000.service.d/60-ak47-tasksmax-slice.conf
#         sudo systemctl daemon-reload
# The running manager picks the new value up on the next unit start; the bound
# returns to 12000 without restarting anything.
[Service]
TasksMax=24576
