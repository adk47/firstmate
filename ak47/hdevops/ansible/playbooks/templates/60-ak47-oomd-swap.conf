# ak47 (2026-11-10): the box locked up with swap at 99-100% of 32 GB while
# 77 GB of RAM sat free. Nothing was watching swap: systemd-oomd was not
# installed, and ak47-health paged on load15 only, which never crossed 64.
#
# ManagedOOMSwap=kill is deliberate, not auto. systemd 255 monitors a cgroup
# for swap only when the value is `kill`; `auto` is accepted but never
# monitored (systemd-oomd.service(8): "Cgroups of units with ManagedOOMSwap=
# or ManagedOOMMemoryPressure= set to kill will be monitored"). Verified on
# this box: auto left `Swap Monitored CGroups` empty, kill listed the slice.
#
# The action is bounded by the daemon's SwapUsedLimit (90% default), so this
# cannot fire on ordinary idle paging.
#
# Revert: sudo rm /etc/systemd/system/user@1000.service.d/60-ak47-oomd-swap.conf
#         sudo systemctl daemon-reload && sudo systemctl restart systemd-oomd
[Service]
ManagedOOMSwap=kill
