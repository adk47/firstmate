# ak47 (2026-11-10): these units are the fleet's spine. If systemd-oomd ever
# has to choose a victim, it must not choose one of them: killing the tmux
# server, the seat proxy, the cluster tunnel or the chair takes the whole
# fleet down, which is worse than the memory pressure it was relieving.
#
# ManagedOOMPreference=avoid is a preference, not an exemption: oomd still
# kills one of these if nothing else is eligible.
#
# Revert: sudo rm /etc/systemd/system/<unit>.service.d/60-ak47-oomd-avoid.conf
#         sudo systemctl daemon-reload
[Service]
ManagedOOMPreference=avoid
