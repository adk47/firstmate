# ak47 (2026-11-14): user@1000.service hit pids.max 12000 at 02:49Z and every
# fork in the uid returned EAGAIN until 08:04Z. The fleet's watcher, every worker
# shell and every check failed to start for five hours.
#
# Root cause of the starvation is not the slice cap alone: every unit inside the
# slice inherited TasksMax=140836 and shared nothing, so ONE tmux child pane
# scope (peak 138,696 tasks) could take the whole slice and starve every other
# lane. The durable fix is a per-unit default here, applied by the user manager
# to every unit that does not set its own TasksMax - including the transient
# tmux-spawn scopes, which have no drop-in path of their own.
#
# 4096 per unit: four times the largest legitimate single-lane footprint measured
# on this box (orca's node daemon holds 372 threads; the biggest real pane held
# ~950), and one sixth of the slice cap, so one runaway lane can no longer starve
# the other five. A lane that needs more must say so in a drop-in, which is an
# explicit act rather than an accident.
#
# Revert: sudo rm /etc/systemd/user.conf.d/60-ak47-tasksmax-user.conf
#         log out and back in (the user manager reads user.conf at start), or
#         sudo systemctl restart user@1000.service to apply it immediately -
#         that restarts every unit in the slice, so it is NOT the quiet revert.
[Manager]
DefaultTasksMax=4096
