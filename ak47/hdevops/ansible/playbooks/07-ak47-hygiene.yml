---
# ============================================================
# 07-ak47-hygiene.yml — the ak47 factory box's hygiene system, as code
# ============================================================
# 2026-11-10: ak47's /tmp held 950,700 entries, 831,000 of them the default temp
# directory of a Python or shell test suite that never removed it. Disk was 14%
# full, so nothing that watched bytes ever looked. The cost was paid by every
# glob, every `ls`, every `find` and every test run on the box, and it showed up
# as load15 14-240 rather than as a disk alert.
#
# The scripts are developed in firstmate and captured in this repo's payload:
#   files/ak47/tick.sh            the deterministic 5-minute tick
#   files/ak47/status.sh          the budget, rendered against live samples
#   files/ak47/census.sh          which producer creates the growth
#   files/ak47/guards/            a check per producer that fails when it stops cleaning up
#   files/ak47/weekly-review.sh   proposes threshold diffs, never applies them
#   bin/fm-spawn.sh               exports a per-task TMPDIR so a leak lands in the
#                                 task's own scratch root and teardown removes it
#
# What this playbook owns is everything that would be lost in a rebuild: the
# scripts, the two user timers, and the two sysctls that were hand-written on the
# box on 2026-11-03 and 2026-11-10 with no record anywhere else. The installed
# units run from the payload copy under ~/.local/lib/ak47, not from a firstmate
# checkout.
#
# It is NOT in site.yml on purpose. site.yml targets the OVH cluster; this
# targets one workstation over a local connection. Adding it to site.yml would
# try to apply workstation units to cluster nodes.
#
# Revert (<1 min, keeps every log and every quarantine directory):
#   systemctl --user disable --now ak47-devops.timer ak47-devops-weekly.timer
#   rm ~/.config/systemd/user/ak47-devops{,-weekly}.{service,timer}
#   systemctl --user daemon-reload
#   sudo rm /etc/sysctl.d/60-ak47-swap.conf /etc/sysctl.d/60-ak47-inotify.conf
#   sudo sysctl -w vm.swappiness=60 fs.inotify.max_user_instances=128
#   sudo rm /etc/systemd/system/user@1000.service.d/60-ak47-oomd-swap.conf
#   sudo rm -r /etc/systemd/system/{fm-tmux-anchor,orca-serve,cli-proxy-api,\
#     kube-tunnel-node1,fm-chair,fm-fleet-revive}.service.d
#   sudo systemctl daemon-reload && sudo systemctl restart systemd-oomd
#   sudo apt remove systemd-oomd
#   rm ~/bin/ak47-health.sh ~/.config/systemd/user/ak47-health.{service,timer}
#
# Usage:
#   ansible-playbook -i inventory/local playbooks/07-ak47-hygiene.yml --check --diff
#   ansible-playbook -i inventory/local playbooks/07-ak47-hygiene.yml
# ============================================================

- name: ak47 hygiene — budget, tick, guards, weekly review
  hosts: ak47
  gather_facts: true

  vars:
    ak47_install_dir: "{{ ak47_home }}/.local/lib/ak47"
    ak47_unit_dir: "{{ ak47_home }}/.config/systemd/user"
    ak47_state_dir: "{{ ak47_home }}/.local/state/ak47"
    ak47_config_dir: "{{ ak47_home }}/.config/ak47"

  tasks:
    # ---- the code must already be there -------------------------------------
    # This playbook deploys a system whose scripts live in firstmate. If the
    # checkout is missing, fail loudly rather than installing a timer that will
    # fail every five minutes and look installed.
    - name: The hygiene scripts must exist in the firstmate checkout
      ansible.builtin.stat:
        path: "{{ ak47_repo }}/ak47/tick.sh"
      register: ak47_tick

    - name: Refuse to install a timer whose unit cannot run
      ansible.builtin.assert:
        that: ak47_tick.stat.exists and ak47_tick.stat.executable
        fail_msg: >-
          {{ ak47_repo }}/ak47/tick.sh is missing or not executable. Update the
          firstmate checkout first; the installed copy comes from this repo's
          payload, but the source tree must still be present.

    # ---- the code, from the payload -----------------------------------------
    # The scripts are captured in this repo so a rebuild does not need a
    # firstmate checkout. The assert above still proves the source tree exists.
    - name: Create the installed script directory
      ansible.builtin.file:
        path: "{{ ak47_install_dir }}"
        state: directory
        owner: "{{ ak47_user }}"
        mode: "0755"

    - name: Install the hygiene scripts from the payload
      ansible.builtin.copy:
        src: "files/ak47/"
        dest: "{{ ak47_install_dir }}/"
        owner: "{{ ak47_user }}"
        mode: preserve

    # ---- sysctls ------------------------------------------------------------
    # Both were hand-written on the box and existed nowhere else. Captured here
    # verbatim, including their measured reasons and their revert lines.
    - name: Install the ak47 sysctls
      ansible.builtin.copy:
        src: "templates/{{ item }}"
        dest: "/etc/sysctl.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - 60-ak47-swap.conf
        - 60-ak47-inotify.conf
      become: true
      register: ak47_sysctl

    - name: Apply the sysctls now
      ansible.builtin.command: sysctl --system
      become: true
      when: ak47_sysctl.changed
      changed_when: true

    # ---- systemd-oomd: the swap and memory-pressure killer ------------------
    # 2026-11-10: the box locked up with swap at 99-100% of 32 GB while 77 GB of
    # RAM sat free. systemd-oomd was not installed, so nothing was watching swap
    # at all. It is the only component on the box that can kill a cgroup.
    - name: Install systemd-oomd
      ansible.builtin.apt:
        name: systemd-oomd
        state: present
      become: true

    # ManagedOOMSwap=kill, not auto: systemd 255 only monitors a cgroup for swap
    # when the value is `kill`. See the template header for the verification.
    - name: Monitor the user slice for swap pressure
      ansible.builtin.copy:
        src: templates/60-ak47-oomd-swap.conf
        dest: /etc/systemd/system/user@1000.service.d/60-ak47-oomd-swap.conf
        owner: root
        group: root
        mode: "0644"
      become: true
      register: ak47_oomd_swap

    # The fleet's spine must never be oomd's first choice of victim.
    - name: Spare the fleet's spine from oomd
      ansible.builtin.copy:
        src: templates/60-ak47-oomd-avoid.conf
        dest: "/etc/systemd/system/{{ item }}.service.d/60-ak47-oomd-avoid.conf"
        owner: root
        group: root
        mode: "0644"
      loop:
        - fm-tmux-anchor
        - orca-serve
        - cli-proxy-api
        - kube-tunnel-node1
        - fm-chair
        - fm-fleet-revive
      become: true
      register: ak47_oomd_avoid

    - name: Reload the system manager
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: ak47_oomd_swap.changed or ak47_oomd_avoid.changed

    # A restart, not just a reload: on this box oomd's dbus name did not appear
    # until the daemon was restarted, and `oomctl` timed out until it was.
    - name: Start systemd-oomd
      ansible.builtin.systemd:
        name: systemd-oomd
        state: restarted
        enabled: true
      become: true

    - name: Read the oomd policy back
      ansible.builtin.command: oomctl
      register: ak47_oomctl
      changed_when: false
      failed_when: ak47_oomctl.rc != 0

    - name: Show the oomd policy
      ansible.builtin.debug:
        var: ak47_oomctl.stdout_lines

    # ---- the health beat ----------------------------------------------------
    # ak47-health.sh is the 10-minute beat: it pages on load, swap and memory
    # pressure, and it pages when the hygiene tick itself stops writing.
    - name: Install the health beat
      ansible.builtin.copy:
        src: templates/ak47-health.sh
        dest: "{{ ak47_home }}/bin/ak47-health.sh"
        owner: "{{ ak47_user }}"
        mode: "0755"
      register: ak47_health_script

    - name: Install the health beat units
      ansible.builtin.copy:
        src: "templates/{{ item }}"
        dest: "{{ ak47_unit_dir }}/{{ item }}"
        owner: "{{ ak47_user }}"
        mode: "0644"
      loop:
        - ak47-health.service
        - ak47-health.timer
      register: ak47_health_units

    - name: Enable the health beat
      ansible.builtin.systemd:
        scope: user
        name: ak47-health.timer
        enabled: true
        daemon_reload: "{{ ak47_health_units.changed }}"

    # ---- state and config directories ---------------------------------------
    - name: Create the state, cache and config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ak47_user }}"
        mode: "0755"
      loop:
        - "{{ ak47_state_dir }}"
        - "{{ ak47_home }}/.cache/ak47"
        - "{{ ak47_config_dir }}"

    # ---- units --------------------------------------------------------------
    - name: Install the user units
      ansible.builtin.copy:
        src: "templates/{{ item }}"
        dest: "{{ ak47_unit_dir }}/{{ item }}"
        owner: "{{ ak47_user }}"
        mode: "0644"
      loop:
        - ak47-devops.service
        - ak47-devops.timer
        - ak47-devops-weekly.service
        - ak47-devops-weekly.timer
      register: ak47_units

    - name: Reload the user manager
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      when: ak47_units.changed

    # ---- enable -------------------------------------------------------------
    # `enabled: true` only. Starting is left to the timer's own OnBootSec, so a
    # deploy never fires a tick in the middle of someone's test run.
    - name: Enable the timers
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        enabled: true
      loop:
        - ak47-devops.timer
        - ak47-devops-weekly.timer

    # ---- prove it -----------------------------------------------------------
    - name: Read the budget back
      ansible.builtin.command: "{{ ak47_install_dir }}/status.sh --print"
      register: ak47_status
      changed_when: false
      failed_when: ak47_status.rc != 0

    - name: Show the budget
      ansible.builtin.debug:
        var: ak47_status.stdout_lines
