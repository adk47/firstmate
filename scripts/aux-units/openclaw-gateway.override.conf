# Drop-in: /etc/systemd/system/openclaw-gateway-<profile>.service.d/override.conf
#
# Installed by scripts/install-aux-units.sh, one copy per profile
# (main, edge, dev). The PROFILE name is hard-coded into each copy
# at install time — these gateway units are NOT systemd templates,
# so %i is unavailable.
#
# Why these knobs:
#   ExecStartPre=…/openclaw-pre-start-heal.sh <profile>
#     Self-heal a schema-invalid openclaw.json *before* the gateway
#     process tries to read it. Three layers (validate → doctor --fix
#     → bak-walk). A corrupt write becomes a 0-impact event instead
#     of a crash-loop outage. Background: 2026-05-05 main-gateway
#     ~30 min outage caused by an out-of-band write that added a
#     `subagents` top-level key not in the openclaw 2026.4.27 schema.
#
#   StartLimitBurst=5 / StartLimitIntervalSec=120
#     Stop systemd from infinitely respawning the gateway when
#     pre-start-heal can't recover the config (e.g. all .bak-*
#     snapshots are also schema-invalid because a major openclaw
#     upgrade outpaced the snapshot rotation). After 5 failed starts
#     in 120 s, the unit goes to `failed` and the watchdog cron
#     (every 2 min) Slack-alerts. Better visible-failure than
#     silent-rot. Pair with `systemctl reset-failed` after a fix.
#
#   ExecStartPost=-/usr/bin/systemctl start --no-block openclaw-edge-reindex.service
#     EDGE ONLY. openclaw 2026.6.1 pauses the memory_search vector index
#     on every gateway restart and does not auto-rebuild it, so every edge
#     restart left retrieval ungrounded until the 10-min cron watchdog.
#     This fires openclaw-edge-reindex.service (openclaw-edge-reindex-on-start.sh)
#     after every start to rebuild it within seconds. ExecStartPost (not a
#     Wants= companion) so it also fires on Restart=always crash/OOM
#     auto-restarts; --no-block so the gateway reaches `active` immediately
#     (deploy.sh's 30s is-active poll must not be delayed by the re-embed);
#     leading `-` so a missing/failed trigger never blocks gateway start.
#
# The block below is the reference for the EDGE copy (with the ExecStartPost).
# The main copy is identical minus that line. Authoritative generation lives in
# scripts/install-aux-units.sh (edge-only conditional).
[Service]
ExecStartPre=/opt/hydra/scripts/openclaw-pre-start-heal.sh PROFILE_PLACEHOLDER
ExecStartPost=-/usr/bin/systemctl start --no-block openclaw-edge-reindex.service
[Unit]
StartLimitBurst=5
StartLimitIntervalSec=120
