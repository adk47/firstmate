# Drop-in: /etc/systemd/system/openclaw-gateway-<profile>.service.d/override.conf
#
# Installed by scripts/install-aux-units.sh, one copy per profile
# (main, edge, dev). The PROFILE name is hard-coded into each copy
# at install time — these gateway units are NOT systemd templates,
# so %i is unavailable.
#
# Why these knobs:
#   ExecStartPre=…/openclaw-pre-start-heal.sh <profile>
#     Self-heal a schema-invalid openclaw.json *before* the gateway
#     process tries to read it. Three layers (validate → doctor --fix
#     → bak-walk). A corrupt write becomes a 0-impact event instead
#     of a crash-loop outage. Background: 2026-05-05 main-gateway
#     ~30 min outage caused by an out-of-band write that added a
#     `subagents` top-level key not in the openclaw 2026.4.27 schema.
#
#   StartLimitBurst=5 / StartLimitIntervalSec=120
#     Stop systemd from infinitely respawning the gateway when
#     pre-start-heal can't recover the config (e.g. all .bak-*
#     snapshots are also schema-invalid because a major openclaw
#     upgrade outpaced the snapshot rotation). After 5 failed starts
#     in 120 s, the unit goes to `failed` and the watchdog cron
#     (every 2 min) Slack-alerts. Better visible-failure than
#     silent-rot. Pair with `systemctl reset-failed` after a fix.
#
#   ExecStartPost=-/usr/bin/systemctl start --no-block openclaw-edge-reindex.service
#     EDGE ONLY. openclaw 2026.6.1 pauses the memory_search vector index
#     on every gateway restart and does not auto-rebuild it, so every edge
#     restart left retrieval ungrounded until the 10-min cron watchdog.
#     This fires openclaw-edge-reindex.service (openclaw-edge-reindex-on-start.sh)
#     after every start to rebuild it within seconds. ExecStartPost (not a
#     Wants= companion) so it also fires on Restart=always crash/OOM
#     auto-restarts; --no-block so the gateway reaches `active` immediately
#     (deploy.sh's 30s is-active poll must not be delayed by the re-embed);
#     leading `-` so a missing/failed trigger never blocks gateway start.
#
#   Environment="NODE_OPTIONS=--max-old-space-size=8192 --diagnostic-dir=…"
#     Node's default heap cap (~4 GB) sits below main's normal working set;
#     every spike past it was a V8 heap-OOM SIGABRT (8 between 2026-09-17
#     and 09-23), each followed by a ~10 min post-restart freeze. Heap
#     snapshots are now disabled (--heapsnapshot-near-heap-limit removed
#     due to measured 2m27s–2m40s GC pause overhead per crash); diagnostic
#     reports still write to /var/lib/hydra/heap-snapshots (aged out after
#     3d by tmpfiles using mtime only, so incident investigation does not
#     reset the cleanup timer).
#
#   Environment="OPENCLAW_GATEWAY_STARTUP_TRACE=1" (+ four siblings, see below)
#     MAIN ONLY, TEMPORARY (MUS-1295 / MUS-2652): main freezes 20-28 min after
#     every start with the main thread at 100% CPU and the cause is still
#     unnamed. These are openclaw's own trace flags, not ours: per-span
#     "startup trace:" / "restart.ready.*" journal lines, plus a JSONL timeline
#     (/var/lib/hydra/diag/main-timeline.jsonl, aged out after 3d by tmpfiles)
#     whose event-loop samples name the span running at each stall.
#     OPENCLAW_DIAGNOSTICS=timeline, NOT =1: =1 is the wildcard and enables all
#     nine flags, incl. brave.http / telegram.http (provider HTTP in the journal).
#     Removal: delete the five lines + /etc/tmpfiles.d/hydra-gateway-diag.conf,
#     re-run scripts/install-aux-units.sh.
#
#   MemoryLow=6G
#     EDGE ONLY. Protects Caroline (edge) from reclaim when main / Paperclip
#     put node-8 under memory pressure. Aaron's go 9 Oct via Nick (MUS-5057
#     W3). Live on node-8 since 8 Oct as a hand-placed drop-in; codified here
#     so it survives a rebuild (MUS-6310). Soft protection only: MemoryMax
#     stays infinity. Accounting is already on via the host's
#     DefaultMemoryAccounting=yes (systemd 255), so no MemoryAccounting= line.
#
# The block below is the reference for the EDGE copy (with the ExecStartPost
# and MemoryLow lines). The main copy is identical minus those two lines; the five
# OPENCLAW_ lines are MAIN ONLY (edge omits them). Authoritative generation lives in
# scripts/install-aux-units.sh (edge-only conditional).
[Service]
Environment="NODE_OPTIONS=--max-old-space-size=8192 --diagnostic-dir=/var/lib/hydra/heap-snapshots"
Environment="OPENCLAW_GATEWAY_STARTUP_TRACE=1"
Environment="OPENCLAW_GATEWAY_RESTART_TRACE=1"
Environment="OPENCLAW_DIAGNOSTICS=timeline"
Environment="OPENCLAW_DIAGNOSTICS_EVENT_LOOP=1"
Environment="OPENCLAW_DIAGNOSTICS_TIMELINE_PATH=/var/lib/hydra/diag/main-timeline.jsonl"
ExecStartPre=/opt/hydra/scripts/openclaw-pre-start-heal.sh PROFILE_PLACEHOLDER
ExecStartPost=-/usr/bin/systemctl start --no-block openclaw-edge-reindex.service
MemoryLow=6G
[Unit]
StartLimitBurst=5
StartLimitIntervalSec=120
