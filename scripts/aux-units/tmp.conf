# MANAGED BY scripts/install-aux-units.sh (source: scripts/aux-units/tmp.conf).
# DO NOT EDIT BY HAND on node-8; the next deploy re-installs this file verbatim.
#
# /tmp age policy for node-8, keyed on MTIME ONLY.
#
# Shadows /usr/lib/tmpfiles.d/tmp.conf (same basename wins), whose whole content
# is the stock `D /tmp 1777 root root 30d` line.
#
# 2026-08-11: node-8 / was 77.5% used with a 17-day runway; /tmp held 181 GB
# across 14,042 entries (qa-*/core-backend-* autoreview worktrees + build
# scratch). The stock 30d policy was tightened to 7d by hand.
#
# 2026-08-26: the 7d policy had reclaimed 0 bytes. systemd-tmpfiles ages an
# entry by newest-of(atime,btime,ctime,mtime); / is mounted relatime and a
# nightly ~19:15Z read-walk of /tmp refreshed atime on every entry, so nothing
# ever matured and /tmp regrew to ~200 GB (78% used). The `mM:` age-by prefix
# (lowercase m = files' mtime, uppercase M = dirs' mtime; tmpfiles.d(5)) restricts
# the age test to mtime, so the read-walk no longer resets the clock. Verified
# on systemd 255.4 via `systemd-tmpfiles --create` (no parse error; note that
# `--dry-run` is NOT a valid flag on 255.4).
#
# 7d -> 14d: once the rule actually runs, a blanket 7d would also reap ~15 GiB
# of unprefixed human/ops scratch that had survived only on the atime bug; 14d
# reaps only what is genuinely older than two weeks. The ~43 GiB hog was
# reclaimed one-time on 2026-08-26 (0 of 426 entries held open) and is bounded
# going forward by this rule. Measured 2026-09-05: / at 53%, 0 entries >14d.
#
# 14d -> 24h (2026-10-08): the 14d floor reclaimed nothing in the incident where
# / went 85% -> 93% in 26h (32 of 6,055 entries were >1d old). 24h is the
# catch-all; hourly hydra-tmp-reaper (scripts/tmp-reaper.sh) handles the known
# scratch patterns in hours, with an open-handle check this file cannot do.
#
# `mM:` also removes the atime accident that was shielding the permanently
# mtime-old socket dirs (no stock exclusion covers them in this file), so they
# are excluded explicitly. systemd-private-* stays excluded via
# /usr/lib/tmpfiles.d/systemd-tmp.conf (different basename, not masked here).
#
# This file was a hand-edit on node-8 from 2026-08-11 to 2026-09-05 (H-DevOps
# devops-agent, disk-pressure route #285); codified here so it survives a node
# rebuild. install-aux-units.sh keeps the first pre-managed copy beside it as
# tmp.conf.pre-managed (tmpfiles.d ignores non-.conf names).
#
# ROLLBACK: `cp /etc/tmpfiles.d/tmp.conf.pre-managed /etc/tmpfiles.d/tmp.conf`
# then `systemd-tmpfiles --create /etc/tmpfiles.d/tmp.conf`. To go back to the
# stock 30d policy, remove /etc/tmpfiles.d/tmp.conf entirely.
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.Test-unix
D /tmp 1777 root root mM:24h
